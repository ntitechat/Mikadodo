r;color:var(--muted)}.fab{position:fixed;right:18px;bottom:88px;background:var(--green);color:#fff;border-radius:999px;padding:14px 20px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:15}.bottom{position:fixed;bottom:0;left:0;right:0;height:72px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30}.bottom button{flex:1;background:#fff;color:#888;font-weight:800;font-size:12px;padding:4px 1px}.settings-bottom{color:#888!important}.bottom button.active{color:var(--green)}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal-back.show{display:flex}.modal{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.agenda-deco{font-size:11px;color:#D889A1;opacity:.55;margin-left:6px}.category-total{font-weight:900;color:#B65F78;font-size:14px}.timer-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:82px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(105,72,84,.18);border-radius:999px;padding:10px 14px;z-index:70;display:none;align-items:center;gap:10px}.timer-bar.show{display:flex}.timer-time{font-weight:900;color:var(--purple);min-width:54px;text-align:center}.clickable{cursor:pointer}.clickable:active{transform:scale(.995)}.ingredient-list{list-style:none;padding:0;margin:0}.ingredient-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}.ingredient-row input{width:16px;height:16px;accent-color:var(--purple);margin:0}.ingredient-row.used span{text-decoration:line-through;color:#999}.stock-photo-preview{width:100%;height:160px;border-radius:16px;object-fit:cover;display:none;border:1px solid var(--line);margin-top:8px}.shop-actions{display:flex;gap:6px;align-items:center}.btn.mini{padding:8px 10px;border-radius:10px;font-size:13px}.modal h2{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:999px;z-index:80;display:none}.toast.show{display:block}.notif{background:#fff4cf;border-left:5px solid var(--warning);padding:13px;border-radius:12px;margin:10px 0}.small{font-size:13px;color:var(--muted)}
@media(max-width:600px){main{padding:12px}.hero{height:58px}.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.shopping-summary{grid-template-columns:1fr 1fr}.shopping-summary .summary:last-child{grid-column:1/-1}.recipe-card{min-height:104px;gap:12px;padding:10px 0}.recipe-card .recipe-photo{flex-basis:120px;width:120px;height:92px}.recipe-card .card-body{padding:4px 0}.recipe-card .card h3,.recipe-card h3{font-size:16px}.recipe-photo{height:105px}.card-body{padding:11px}.card h3{font-size:16px}.fab{bottom:84px}}
.decor-spark{position:absolute;right:76px;bottom:26px;font-size:15px;letter-spacing:7px;opacity:.65}.recipe-detail-photo{display:block;width:150px!important;height:110px;object-fit:cover;border-radius:16px;margin:18px auto 4px!important;box-shadow:var(--shadow);cursor:zoom-in}.ingredient-row{padding:6px 0;gap:8px}.ingredient-row input{width:17px;height:17px;flex:0 0 17px}.notes-list{display:grid;gap:9px}.note-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:15px;padding:12px 13px;box-shadow:var(--shadow)}.note-item input{width:18px;height:18px;flex:0 0 18px;accent-color:var(--purple)}.note-item span{flex:1}.note-item.done span{text-decoration:line-through;color:#999}.note-add{display:flex;gap:8px;margin-bottom:14px}.note-add input{flex:1;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.photo-zoom{position:fixed;inset:0;background:rgba(41,35,38,.78);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}.photo-zoom.show{display:flex}.photo-zoom img{max-width:95vw;max-height:88vh;object-fit:contain;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.28)}.photo-zoom button{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;background:#fff;font-size:22px}</style>

<body>
<div class="app">
<header class="top">
  <div class="hero"></div>
  <nav class="top-nav" aria-label="Navigation principale"><button class="active" data-view="recipes">📖 Recettes</button><button data-view="stock">🧊 Stock</button><button data-view="agenda">📅 Agenda</button><button data-view="shopping">🛒 Courses</button></nav>
</header>
<main>
<section id="recipes" class="view active">
 <div class="section-head"><h2>Mes recettes</h2></div>
 <input id="recipeSearch" class="search" placeholder="🔍 Rechercher une recette, un ingrédient…" oninput="renderRecipes()"/>
 <div id="recipeChips" class="chips"></div><div id="recipeGrid" class="grid"></div>
</section>
<section id="stock" class="view">
 <div class="section-head"><h2>Mon stock</h2><button class="btn" onclick="openStockModal()">＋ Ajouter</button></div>
 <input id="stockSearch" class="search" placeholder="🔍 Rechercher par nom ou marque…" oninput="renderStock()"/>
 <div class="chips"><button class="chip active" onclick="stockFilter='all';renderStock()">Tout</button><button class="chip" onclick="stockFilter='Réfrigérateur';renderStock()">🧊 Réfrigérateur</button><button class="chip" onclick="stockFilter='Congélateur';renderStock()">❄️ Congélateur</button><button class="chip" onclick="stockFilter='Placard';renderStock()">🏠 Placard</button></div>
 <div id="stockList"></div>
</section>
<section id="agenda" class="view">
 <div class="section-head"><h2>Agenda des repas</h2><div class="shop-actions"><button class="btn ghost mini" onclick="toggleMonthView()" id="monthViewBtn">🗓️ Mois</button><button class="btn" onclick="openAgendaModal()">＋ Repas</button></div></div>
 <div class="notif" id="nextReminder">🔔 Les rappels de préparation apparaîtront ici.</div>
 <div id="calendar" class="calendar"></div>
</section>
<section id="shopping" class="view">
 <div class="section-head"><h2>Liste de courses</h2><button class="btn" onclick="openShopModal()">＋ Article</button></div>
 <div class="shopping-summary"><div class="summary"><small>Pas acheté</small><strong id="notBought">0 €</strong></div><div class="summary"><small>Acheté</small><strong id="bought">0 €</strong></div><div class="summary"><small>Total</small><strong id="total">0 €</strong></div></div>
 <div id="shopList"></div>
</section><section id="notes" class="view"><div class="section-head"><div><h2>📝 Notes</h2><div class="small">Tes listes, simplement.</div></div></div><div class="note-add"><input id="noteInput" placeholder="Ajouter un élément…" onkeydown="if(event.key==='Enter')addNote()"><button class="btn purple" onclick="addNote()">＋</button></div><div id="notesList" class="notes-list"></div></section>
</main>
<button class="fab" id="fab" onclick="quickAdd()">＋ Ajouter</button>
<nav class="bottom"><button class="active" data-view="recipes">📖<br>Recettes</button><button data-view="stock">🧊<br>Stock</button><button data-view="agenda">📅<br>Agenda</button><button data-view="shopping">🛒<br>Courses</button><button data-view="notes">📝<br>Notes</button><button class="settings-bottom" onclick="openSettings()">⚙️<br>Paramètres</button></nav>
</div>
<div id="photoZoom" class="photo-zoom" onclick="if(event.target===this)closePhotoZoom()"><button onclick="closePhotoZoom()">×</button><img id="photoZoomImg" alt="Photo agrandie"></div><div id="modalBack" class="modal-back" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div><div id="timerBar" class="timer-bar"><span>🔥 Cuisson</span><span id="timerTime" class="timer-time">00:00</span><button class="btn ghost mini" onclick="stopCookingTimer()">Arrêter</button></div><div id="toast" class="toast"></div>
<script>
const KEY='maCuisineV1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 recipes:[
  {id:1,name:'Hachis parmentier',cat:'Plat',prep:20,cook:30,serv:4,cost:11.8,keep:3,keepUnit:'jours',keepPlace:'Réfrigérateur',emoji:'🥔',ingredients:['500 g viande hachée','1 kg pommes de terre','50 cl lait','50 g beurre','100 g fromage'],steps:['Préparer la purée.','Faire revenir la viande.','Assembler dans un plat.','Ajouter le fromage puis cuire 30 min.']},
  {id:2,name:'Couscous',cat:'Plat',prep:30,cook:60,serv:4,cost:12,keep:3,keepUnit:'jours',keepPlace:'Réfrigérateur',emoji:'🍲',ingredients:['500 g agneau ou bœuf','100 g poulet','100 ml coulis de tomate','1,2 L eau','3 patates','2 carottes','2 navets','200 g pois chiche','300 g semoule','2 c. à s. huile d’olive'],steps:['Préparer la viande et les légumes.','Faire mijoter le bouillon.','Préparer la semoule.','Servir chaud.']},
  {id:3,name:'Mousse au chocolat',cat:'Dessert',prep:20,cook:0,serv:4,cost:4.5,keep:2,keepUnit:'jours',keepPlace:'Réfrigérateur',emoji:'🍫',ingredients:['200 g chocolat','4 œufs','1 pincée de sel'],steps:['Faire fondre le chocolat.','Séparer les blancs des jaunes.','Monter les blancs en neige.','Incorporer délicatement.']}
 ],
 stock:[{id:101,name:'Muffins',place:'Congélateur',qty:1,unit:'x',date:'2026-11-01',days:null,emoji:'🧁'},{id:102,name:'Pesto',place:'Congélateur',qty:2,unit:'x',date:'2026-12-01',days:null,emoji:'🌿'},{id:103,name:'Lait',place:'Réfrigérateur',qty:2,unit:'L',date:'2026-09-14',days:null,emoji:'🥛'}],
 shopping:[{id:201,name:'Lait',qty:2,price:1.5,done:false,cat:'Produits laitiers'},{id:202,name:'Tomates',qty:1,price:1,done:false,cat:'Fruits et légumes'},{id:203,name:'Pain',qty:1,price:1,done:false,cat:'Épicerie'}],
 agenda:[],
 recipeCategories:['Petit-déjeuner','Entrée','Salade','Soupe','Plat','Accompagnement','Sandwich','Dessert','Boisson','Goûter','Apéritif'],
 shoppingCategories:['Fruits et légumes','Viandes','Poissons','Produits laitiers','Épicerie','Surgelés','Boissons','Hygiène','Maison','Autre'],
 notes:[]
};
state.recipeCategories=state.recipeCategories||['Petit-déjeuner','Entrée','Salade','Soupe','Plat','Accompagnement','Sandwich','Dessert','Boisson','Goûter','Apéritif'];
state.shoppingCategories=state.shoppingCategories||['Fruits et légumes','Viandes','Poissons','Produits laitiers','Épicerie','Surgelés','Boissons','Hygiène','Maison','Autre'];
state.notes=state.notes||[];
state.shopping.forEach(x=>x.cat=x.cat||'Autre');
state.recipes.forEach(r=>{r.used=r.used||{};r.usedStock=r.usedStock||{};r.photos=Array.isArray(r.photos)?r.photos:(r.photo?[r.photo]:[]);r.photo=r.photos[0]||'';r.servUnit=r.servUnit||'personnes';if(r.keepUnit==='années')r.keepUnit='année'});state.stock.forEach(x=>x.photo=x.photo||'');
state.agenda.forEach(x=>{x.notifyTime=x.notifyTime||startTime(x.time,x.duration||0)});
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){console.error(e);toast('Impossible d’enregistrer : stockage du navigateur plein');return false}}function money(n){return (Number(n)||0).toFixed(2).replace('.',',')+' €'}function fmtDate(d){return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
let currentView='recipes';
let navigationReady=false;
function applyView(v){currentView=v||'recipes';document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===currentView));document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===currentView));document.getElementById('fab').style.display=currentView==='recipes'?'block':'none';renderAll()}
function switchView(v,push=true){if(!v)return;if(push){history.pushState({mikadodo:true,view:v},'',`#${v}`)}applyView(v)}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
window.addEventListener('popstate',event=>{
  const st=event.state;
  if(st?.mikadodo){
    if(st.modal){closeModal(true);return}
    applyView(st.view||'recipes');
    return;
  }
  // À la racine de Mikadodo, le bouton Android Retour ne ferme pas l'application au premier appui.
  if(navigationReady){history.pushState({mikadodo:true,view:currentView},'',`#${currentView}`);return}
});
history.replaceState({mikadodo:true,view:'recipes'},'',location.href.split('#')[0]+'#recipes');
history.pushState({mikadodo:true,view:'recipes'},'',`#recipes`);
navigationReady=true;
function renderAll(){renderRecipes();renderStock();renderAgenda();renderShopping();renderNotes();updateReminder()}
const cats=()=>['Toutes',...state.recipeCategories];let activeCat='Toutes',stockFilter='all',shoppingCatFilter='all';
function formatDuration(minutes){minutes=Number(minutes)||0;if(minutes<=0)return '';if(minutes<60)return `${minutes}min`;let h=Math.floor(minutes/60),m=minutes%60;return m?`${h}h${String(m).padStart(2,'0')}`:`${h}h`}
function servingMeta(r){const units={personnes:['👥','personne','personnes'],sandwichs:['🥪','sandwich','sandwichs'],gaufres:['🧇','gaufre','gaufres'],parts:['🍰','part','parts'],biscuits:['🍪','biscuit','biscuits']};const u=units[r.servUnit]||units.personnes;const n=Number(r.serv)||1;return `${u[0]} ${n} ${n===1?u[1]:u[2]}`}
function durationMeta(r){const total=formatDuration((Number(r.prep)||0)+(Number(r.cook)||0));return total?`⏱️ ${total}`:''}
function deleteRecipe(id){let r=state.recipes.find(x=>x.id===id);if(!r)return;if(!confirm(`Supprimer la recette « ${r.name} » ? Cette action est irréversible.`))return;state.recipes=state.recipes.filter(x=>x.id!==id);state.agenda=state.agenda.filter(x=>x.recipeId!==id);save();closeModal();renderAll();updateReminder();toast('Recette supprimée')}
function renderRecipes(){let q=(document.getElementById('recipeSearch')?.value||'').toLowerCase();document.getElementById('recipeChips').innerHTML=cats().map(c=>`<button class="chip ${activeCat===c?'active':''}" onclick="setRecipeCategory('${encodeURIComponent(c)}')">${esc(c)}</button>`).join('');let a=state.recipes.filter(r=>(activeCat==='Toutes'||r.cat===activeCat)&&(!q||r.name.toLowerCase().includes(q)||r.ingredients.join(' ').toLowerCase().includes(q)));document.getElementById('recipeGrid').innerHTML=a.length?a.map(r=>`<article class="card recipe-card clickable" onclick="openRecipe(${r.id})"><div class="card-body"><h3>${esc(r.name)}</h3>${durationMeta(r)?`<div class="meta">${durationMeta(r)}</div>`:''}<div class="meta">${esc(r.cat)}</div><div class="meta">Conservation ${r.keepPlace==='Réfrigérateur'?'🧊':r.keepPlace==='Congélateur'?'❄️':'🏠'} ${r.keep||0} ${esc(r.keepUnit||'jours')}</div><div class="small">${servingMeta(r)} · 💰 ${money(r.cost)}</div></div><div class="recipe-photo">${r.photos?.[0]?`<img src="${r.photos[0]}" alt="" loading="lazy">`:''}</div></article>`).join(''):'<div class="empty">Aucune recette trouvée.</div>'}

function openRecipe(id){let r=state.recipes.find(x=>x.id===id);if(!r)return;r.used=r.used||{};r.photos=Array.isArray(r.photos)?r.photos:(r.photo?[r.photo]:[]);let photos=r.photos;let lines=[formatDuration(r.prep)?`⏱️ Préparation : <b>${formatDuration(r.prep)}</b>`:'',formatDuration(r.cook)?`🔥 Cuisson : <b>${formatDuration(r.cook)}</b>`:'',formatDuration((Number(r.prep)||0)+(Number(r.cook)||0))?`⏱️ Total : <b>${formatDuration((Number(r.prep)||0)+(Number(r.cook)||0))}</b>`:''].filter(Boolean).join('<br>');let gallery=photos.length?`<div class="recipe-gallery"><img id="recipeMainPhoto" class="recipe-detail-photo" src="${photos[0]}" alt="${esc(r.name)}" onclick="cycleRecipePhoto(${r.id})">${photos.length>1?`<div class="photo-counter">📷 1 / ${photos.length} — touche la photo pour défiler</div>`:''}</div>`:'';document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML=`<div class="row"><button class="btn ghost" onclick="closeModal()">← Retour</button><div class="shop-actions"><button class="btn ghost" onclick="openRecipeEdit(${r.id})">✏️ Modifier</button><button class="btn danger" style="background:var(--danger)" onclick="deleteRecipe(${r.id})">🗑️ Supprimer</button></div></div>${gallery}<h2 style="font-size:30px;margin-bottom:6px">${esc(r.name)}</h2><div class="meta">${esc(r.cat)} · ${servingMeta(r)} · 💰 ${money(r.cost)}</div><p>${lines?lines+'<br>':''}🧊 Conservation : <b>${r.keep} ${r.keepUnit} au ${r.keepPlace.toLowerCase()}</b></p><h3>Ingrédients</h3><ul class="ingredient-list">${r.ingredients.map((i,n)=>`<li class="ingredient-row ${r.used[n]?'used':''}"><input type="checkbox" ${r.used[n]?'checked':''} onchange="toggleIngredientUsed(${r.id},${n},this.checked)"><span>${esc(i)}</span></li>`).join('')}</ul><h3>Préparation</h3>${r.cook>0?`<div class="actions" style="justify-content:flex-start"><button class="btn purple" onclick="startCookingTimer(${r.cook},'${encodeURIComponent(r.name)}')">⏱️ Lancer le minuteur (${formatDuration(r.cook)})</button></div>`:''}<div>${r.steps.map(s=>`<div style="margin:10px 0">${esc(s)}</div>`).join('')}</div><div class="actions" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px"><button class="btn" onclick="addRecipeToStock(${r.id})">🧊 Mettre dans le stock</button><button class="btn purple" onclick="prefillAgenda(${r.id})">📅 Ajouter au calendrier</button></div>`;showModal()}
function cycleRecipePhoto(id){let r=state.recipes.find(x=>x.id===id);if(!r)return;let photos=Array.isArray(r.photos)?r.photos:(r.photo?[r.photo]:[]);if(photos.length<2)return;let img=document.getElementById('recipeMainPhoto');if(!img)return;let current=Number(img.dataset.index||0);current=(current+1)%photos.length;img.dataset.index=current;img.src=photos[current];let counter=img.parentElement?.querySelector('.photo-counter');if(counter)counter.textContent=`📷 ${current+1} / ${photos.length} — touche la photo pour défiler`}
function zoomPhoto(src){let z=document.getElementById('photoZoom'),im=document.getElementById('photoZoomImg');if(!z||!im)return;im.src=src;z.classList.add('show')}
function closePhotoZoom(){document.getElementById('photoZoom')?.classList.remove('show')}
let cookingTimer={end:0,name:'',interval:null};function startCookingTimer(minutes,name){minutes=Number(minutes)||0;if(minutes<=0)return toast('Cette recette n’a pas de temps de cuisson');if(cookingTimer.interval)clearInterval(cookingTimer.interval);cookingTimer={end:Date.now()+minutes*60000,name:decodeURIComponent(name||''),interval:null};renderCookingTimer();cookingTimer.interval=setInterval(()=>{renderCookingTimer();if(Date.now()>=cookingTimer.end){clearInterval(cookingTimer.interval);cookingTimer.interval=null;document.getElementById('timerTime').textContent='00:00';toast(`Cuisson terminée : ${cookingTimer.name} 🔔`);setTimeout(()=>{document.getElementById('timerBar').classList.remove('show')},2500)}},1000);document.getElementById('timerBar').classList.add('show');toast(`Minuteur lancé : ${minutes} min`)}function renderCookingTimer(){let sec=Math.max(0,Math.ceil((cookingTimer.end-Date.now())/1000));let m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');let el=document.getElementById('timerTime');if(el)el.textContent=`${m}:${s}`}function stopCookingTimer(){if(cookingTimer.interval)clearInterval(cookingTimer.interval);cookingTimer={end:0,name:'',interval:null};document.getElementById('timerBar')?.classList.remove('show');toast('Minuteur arrêté')}
function showModal(){document.getElementById('modalBack').classList.add('show');if(!history.state?.modal){history.pushState({mikadodo:true,view:currentView,modal:true},'',`#${currentView}-modal`)}}
function closeModal(fromHistory=false){document.getElementById('modalBack').classList.remove('show');document.getElementById('modal').className='modal';if(!fromHistory&&history.state?.modal)history.back()}
let notificationTimer=null;
function notificationKey(x){return `mikadodo-notif:${x.id}:${x.date}:${x.notifyTime||startTime(x.time,x.duration)}`}
function wasNotificationSent(x){try{return localStorage.getItem(notificationKey(x))==='1'}catch(e){return false}}
function markNotificationSent(x){try{localStorage.setItem(notificationKey(x),'1')}catch(e){}}
async function showAgendaNotification(x){
  if(!('Notification' in window)||Notification.permission!=='granted')return false;
  const notifyTime=x.notifyTime||startTime(x.time,x.duration);
  const body=`${x.name} — rappel à ${notifyTime}. Repas à ${x.time}.`;
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.ready;
      await reg.showNotification('Mikadodo',{body,tag:`agenda-${x.id}`,renotify:true,icon:'icon-512.png',badge:'icon-512.png',data:{agendaId:x.id}});
      return true;
    }
  }catch(e){}
  return false;
}
async function checkNotifications(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=Date.now();
  for(const x of state.agenda){
    const notifyTime=x.notifyTime||startTime(x.time,x.duration);
    const t=new Date(`${x.date}T${notifyTime}:00`).getTime();
    // Autorise un petit retard (jusqu'à 2 minutes) si Chrome a suspendu la page.
    if(!Number.isNaN(t)&&t<=now&&now-t<=120000&&!wasNotificationSent(x)){
      if(await showAgendaNotification(x))markNotificationSent(x);
    }
  }
}
function scheduleNotificationCheck(){
  if(notificationTimer)clearTimeout(notificationTimer);
  let next=Infinity,now=Date.now();
  state.agenda.forEach(x=>{
    const t=new Date(`${x.date}T${x.notifyTime||startTime(x.time,x.duration)}:00`).getTime();
    if(t>now&&!wasNotificationSent(x)&&t<next)next=t;
  });
  if(next<Infinity)notificationTimer=setTimeout(()=>{checkNotifications().finally(scheduleNotificationCheck)},Math.max(1000,next-now));
}
setInterval(()=>{updateReminder();checkNotifications();scheduleNotificationCheck()},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkNotifications();scheduleNotificationCheck()}});
window.addEventListener('focus',()=>{checkNotifications();scheduleNotificationCheck()});
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>reg.update()).catch(()=>{});
}
renderAll();
checkNotifications();
scheduleNotificationCheck();
</script>
</body></html>
