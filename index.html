<body>
<div class="app">
<header class="top">
  <div class="hero"></div>
  <nav class="top-nav" aria-label="Navigation principale"><button class="active" data-view="recipes">📖 Recettes</button><button data-view="stock">🧊 Stock</button><button data-view="agenda">📅 Agenda</button><button data-view="shopping">🛒 Courses</button></nav>
</header>
<main>
<section id="recipes" class="view active">
 <div class="section-head"><h2>Mes recettes</h2></div>
 <input id="recipeSearch" class="search" placeholder="🔍 Rechercher une recette, un ingrédient…" oninput="renderRecipes()"/>
 <div id="recipeChips" class="chips"></div><div id="recipeGrid" class="grid"></div>
</section>
<section id="stock" class="view">
 <div class="section-head"><h2>Mon stock</h2><button class="btn" onclick="openStockModal()">＋ Ajouter</button></div>
 <input id="stockSearch" class="search" placeholder="🔍 Rechercher par nom ou marque…" oninput="renderStock()"/>
 <div class="chips"><button class="chip active" onclick="stockFilter='all';renderStock()">Tout</button><button class="chip" onclick="stockFilter='Réfrigérateur';renderStock()">🧊 Réfrigérateur</button><button class="chip" onclick="stockFilter='Congélateur';renderStock()">❄️ Congélateur</button><button class="chip" onclick="stockFilter='Placard';renderStock()">🏠 Placard</button></div>
 <div id="stockList"></div>
</section>
<section id="agenda" class="view">
 <div class="section-head"><h2>Agenda des repas</h2><div class="shop-actions"><button class="btn ghost mini" onclick="toggleMonthView()" id="monthViewBtn">🗓️ Mois</button><button class="btn" onclick="openAgendaModal()">＋ Repas</button></div></div>
 <div class="notif" id="nextReminder">🔔 Les rappels de préparation apparaîtront ici.</div>
 <div id="calendar" class="calendar"></div>
</section>
<section id="shopping" class="view">
 <div class="section-head"><h2>Liste de courses</h2><button class="btn" onclick="openShopModal()">＋ Article</button></div>
 
 <div id="shopList"></div>
</section><section id="notes" class="view"><div class="section-head"><div><h2>📝 Notes</h2><div class="small">Tes listes, simplement.</div></div></div><div class="note-add"><input id="noteInput" placeholder="Ajouter un élément…" onkeydown="if(event.key==='Enter')addNote()"><button class="btn purple" onclick="addNote()">＋</button></div><div id="notesList" class="notes-list"></div></section>
</main>
<button class="fab" id="fab" onclick="quickAdd()">＋ Ajouter</button>
<nav class="bottom"><button class="active" data-view="recipes">📖<br>Recettes</button><button data-view="stock">🧊<br>Stock</button><button data-view="agenda">📅<br>Agenda</button><button data-view="shopping">🛒<br>Courses</button><button data-view="notes">📝<br>Notes</button><button class="settings-bottom" onclick="openSettings()">⚙️<br>Paramètres</button></nav>
</div>
<div id="photoZoom" class="photo-zoom" onclick="if(event.target===this)closePhotoZoom()"><button onclick="closePhotoZoom()">×</button><img id="photoZoomImg" alt="Photo agrandie"></div><div id="modalBack" class="modal-back" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div><div id="timerBar" class="timer-bar"><span>🔥 Cuisson</span><span id="timerTime" class="timer-time">00:00</span><button class="btn ghost mini" onclick="stopCookingTimer()">Arrêter</button></div><div id="timerAlarm" class="modal-back" style="z-index:90"><div class="modal" style="text-align:center"><h2>⏰ Minuteur terminé</h2><p id="timerAlarmText" class="small"></p><div class="actions" style="justify-content:center"><button class="btn ghost" onclick="stopCookingTimer()">⏹️ Éteindre</button><button class="btn" onclick="restartCookingTimer()">🔄 Relancer</button></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='maCuisineV1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 recipes:[
  {id:1,name:'Hachis parmentier',cat:'Plat',prep:20,cook:30,serv:4,cost:11.8,keep:3,keepUnit:'jours',keepPlace:'Réfrigérateur',emoji:'🥔',ingredients:['500 g viande hachée','1 kg pommes de terre','50 cl lait','50 g beurre','100 g fromage'],steps:['Préparer la purée.','Faire revenir la viande.','Assembler dans un plat.','Ajouter le fromage puis cuire 30 min.']},
  {id:2,name:'Couscous',cat:'Plat',prep:30,cook:60,serv:4,cost:12,keep:3,keepUnit:'jours',keepPlace:'Réfrigérateur',emoji:'🍲',ingredients:['500 g agneau ou bœuf','100 g poulet','100 ml coulis de tomate','1,2 L eau','3 patates','2 carottes','2 navets','200 g pois chiche','300 g semoule','2 c. à s. huile d’olive'],steps:['Préparer la viande et les légumes.','Faire mijoter le bouillon.','Préparer la semoule.','Servir chaud.']},
  {id:3,name:'Mousse au chocolat',cat:'Dessert',prep:20,cook:0,serv:4,cost:4.5,keep:2,keepUnit:'jours',keepPlace:'Réfrigérateur',emoji:'🍫',ingredients:['200 g chocolat','4 œufs','1 pincée de sel'],steps:['Faire fondre le chocolat.','Séparer les blancs des jaunes.','Monter les blancs en neige.','Incorporer délicatement.']}
 ],
 stock:[{id:101,name:'Muffins',place:'Congélateur',qty:1,unit:'x',date:'2026-11-01',days:null,emoji:'🧁'},{id:102,name:'Pesto',place:'Congélateur',qty:2,unit:'x',date:'2026-12-01',days:null,emoji:'🌿'},{id:103,name:'Lait',place:'Réfrigérateur',qty:2,unit:'L',date:'2026-09-14',days:null,emoji:'🥛'}],
 shopping:[{id:201,name:'Lait',qty:2,price:1.5,done:false,cat:'Produits laitiers'},{id:202,name:'Tomates',qty:1,price:1,done:false,cat:'Fruits et légumes'},{id:203,name:'Pain',qty:1,price:1,done:false,cat:'Épicerie'}],
 agenda:[],
 recipeCategories:['Plat','Soupe','Salade','Accompagnement','Sandwich','Petit-déjeuner','Dessert','Jus','Entrée','Boisson','Goûter','Apéritif'],
 shoppingCategories:['Fruits et légumes','Viandes','Poissons','Produits laitiers','Épicerie','Surgelés','Boissons','Hygiène','Maison','Autre'],
 notes:[],
 mealHistory:[]
};
state.recipeCategories=state.recipeCategories||['Plat','Soupe','Salade','Accompagnement','Sandwich','Petit-déjeuner','Dessert','Jus','Entrée','Boisson','Goûter','Apéritif'];
const preferredRecipeCategoryOrder=['Plat','Soupe','Salade','Accompagnement','Sandwich','Petit-déjeuner','Dessert','Jus'];
state.recipeCategories=[...preferredRecipeCategoryOrder.filter(c=>state.recipeCategories.includes(c)),...state.recipeCategories.filter(c=>!preferredRecipeCategoryOrder.includes(c))];
state.shoppingCategories=state.shoppingCategories||['Fruits et légumes','Viandes','Poissons','Produits laitiers','Épicerie','Surgelés','Boissons','Hygiène','Maison','Autre'];
state.notes=state.notes||[];
state.mealHistory=Array.isArray(state.mealHistory)?state.mealHistory:[];
state.shopping.forEach(x=>x.cat=x.cat||'Autre');
state.recipes.forEach(r=>{r.used=r.used||{};r.usedStock=r.usedStock||{};r.photos=Array.isArray(r.photos)?r.photos:(r.photo?[r.photo]:[]);r.photo=r.photos[0]||'';r.servUnit=r.servUnit||'personnes';if(r.keepUnit==='années')r.keepUnit='année'});state.stock.forEach(x=>x.photo=x.photo||'');
state.agenda.forEach(x=>{x.advisedTime=x.advisedTime||x.notifyTime||startTime(x.time,x.duration||0);x.notifyTime=x.advisedTime});
const PHOTO_DB='MikadodoPhotosV1';
let photoCache={};
function photoDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(PHOTO_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('photos'))r.result.createObjectStore('photos')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function putPhoto(dataUrl,id){const db=await photoDB();const key=id||('p_'+Date.now()+'_'+Math.random().toString(36).slice(2));await new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(dataUrl,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});photoCache['idb:'+key]=dataUrl;return 'idb:'+key}
async function getPhoto(ref){if(!ref)return '';if(!String(ref).startsWith('idb:'))return ref;if(photoCache[ref])return photoCache[ref];try{const db=await photoDB();const key=String(ref).slice(4);const val=await new Promise((res,rej)=>{const tx=db.transaction('photos','readonly');const q=tx.objectStore('photos').get(key);q.onsuccess=()=>res(q.result||'');q.onerror=()=>rej(q.error)});if(val)photoCache[ref]=val;return val}catch(e){return ''}}
function photoSrc(ref){return ref&&photoCache[ref]?photoCache[ref]:''}
async function migratePhotoField(obj,field){let v=obj?.[field];if(typeof v==='string'&&v.startsWith('data:image/')){obj[field]=await putPhoto(v)}else if(Array.isArray(v)){obj[field]=[];for(const item of v)obj[field].push(typeof item==='string'&&item.startsWith('data:image/')?await putPhoto(item):item)}}
async function initPhotoStorage(){try{await photoDB();for(const r of state.recipes){await migratePhotoField(r,'photos');if(typeof r.photo==='string'&&r.photo.startsWith('data:image/'))r.photo=await putPhoto(r.photo);if(!r.photos?.length&&r.photo)r.photos=[r.photo];if(r.photos?.length)r.photo=r.photos[0]}for(const x of state.stock)await migratePhotoField(x,'photo');for(const x of state.agenda)await migratePhotoField(x,'photo');save();for(const r of state.recipes)for(const ref of (r.photos||[]))await getPhoto(ref);for(const x of state.stock)if(x.photo)await getPhoto(x.photo);for(const x of state.agenda)if(x.photo)await getPhoto(x.photo)}catch(e){console.warn('Stockage photos indisponible',e)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){console.error(e);toast('Impossible d’enregistrer : stockage du navigateur plein');return false}}function money(n){return (Number(n)||0).toFixed(2).replace('.',',')+' €'}function recipeMoney(n){let v=Number(n)||0;return (Number.isInteger(v)?String(v):v.toFixed(2).replace(/0+$/,'').replace(/\.$/, '').replace('.',','))+'€'}function fmtDate(d){return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}

function formatDuration(minutes){minutes=Number(minutes)||0;if(minutes<=0)return '';if(minutes<60)return `${minutes}min`;let h=Math.floor(minutes/60),m=minutes%60;return m?`${h}h${String(m).padStart(2,'0')}`:`${h}h`}
function servingMeta(r){
  const units={
    personnes:['👥','personne','personnes'],
    sandwichs:['🥪','sandwich','sandwichs'],
    gaufres:['🧇','gaufre','gaufres'],
    parts:['🍰','part','parts'],

    crepes:['🥞','crêpe','crêpes'],
    donuts:['🍩','donut','donuts'],

function renderRecipes(){let q=(document.getElementById('recipeSearch')?.value||'').toLowerCase();document.getElementById('recipeChips').innerHTML=cats().map(c=>{let count=c==='Toutes'?state.recipes.length:state.recipes.filter(r=>r.cat===c).length;return `<button class="chip ${activeCat===c?'active':''}" onclick="setRecipeCategory('${encodeURIComponent(c)}')">${esc(c)} ${count}</button>`}).join('');let a=state.recipes.filter(r=>(activeCat==='Toutes'||r.cat===activeCat)&&(!q||r.name.toLowerCase().includes(q)||r.ingredients.join(' ').toLowerCase().includes(q))).sort((x,y)=>{if(activeCat!=='Toutes')return String(x.name||'').localeCompare(String(y.name||''),'fr',{sensitivity:'base'});let cx=state.recipeCategories.indexOf(x.cat),cy=state.recipeCategories.indexOf(y.cat);if(cx!==cy)return (cx<0?999:cx)-(cy<0?999:cy);return String(x.name||'').localeCompare(String(y.name||''),'fr',{sensitivity:'base'});});document.getElementById('recipeGrid').innerHTML=a.length?a.map(r=>`<article class="card recipe-card clickable" onclick="openRecipe(${r.id})"><div class="card-body"><h3>${esc(r.name)}</h3>${durationMeta(r)?`<div class="meta">${durationMeta(r)}</div>`:''}<div class="meta">${esc(r.cat)}</div><div class="meta">${r.keepPlace==='Réfrigérateur'?'🧊 Réfrigérateur':r.keepPlace==='Congélateur'?'❄️ Congélateur':'🏠 Placard'} ${r.keep||0} ${esc(r.keepUnit||'jours')}</div><div class="small">${servingMeta(r)} · 💰${recipeMoney(r.cost)}</div></div><div class="recipe-photo">${photoSrc(r.photos?.[0])?`<img src="${photoSrc(r.photos[0])}" alt="" loading="lazy">`:''}</div></article>`).join(''):'<div class="empty">Aucune recette trouvée.</div>'}

{n},this.checked)"><span>${esc(v)}</span></li>`}).join('')}</ul><h3>Préparation</h3>${r.cook>0?`<div class="actions" style="justify-content:flex-start"><button class="btn purple" onclick="startCookingTimer(${r.cook},'${encodeURIComponent(r.name)}')">⏱️ Lancer le minuteur (${formatDuration(r.cook)})</button></div>`:''}<div>${r.steps.map(s=>String(s||'').trim()?`<div style="margin:10px 0">${esc(s)}</div>`:'<div style="height:16px"></div>').join('')}</div><div class="actions" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px"><button class="btn" onclick="addRecipeToStock(${r.id})">🧊 Mettre dans le stock</button><button class="btn purple" onclick="prefillAgenda(${r.id})">📅 Ajouter au calendrier</button></div></div>`;showModal()}
function openRecipeEdit(id){let r=state.recipes.find(x=>x.id===id);if(!r)return;r.photos=Array.isArray(r.photos)?r.photos:(r.photo?[r.photo]:[]);document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML=`<h2>✏️ Modifier la recette</h2><div class="form-grid"><div class="field full"><label>Nom</label><input id="rn" value="${esc(r.name)}"></div><div class="field full"><label>Photos de la recette (2 maximum)</label><input id="rphoto" type="file" accept="image/*" multiple onchange="previewRecipeImages(event)"><div class="photo-help">📷 Tu peux choisir jusqu’à 2 photos. La première sera affichée sur la page d’accueil.</div><div id="rphotoPreviewWrap" class="photo-preview-wrap">${r.photos.map(src=>`<img class="photo-preview-inline" src="${photoSrc(src)||''}" alt="Aperçu">`).join('')}</div></div><div class="field"><label>Catégorie</label><select id="rc">${state.recipeCategories.map(x=>`<option ${r.cat===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Préparation (min)</label><input id="rp" type="number" value="${r.prep}"></div><div class="field"><label>Cuisson (min)</label><input id="rcu" type="number" value="${r.cook}"></div><div class="field"><label>Quantité</label><input id="rs" type="number" value="${r.serv}"></div><div class="field"><label>Type de quantité</label><select id="rsu"><option value="personnes" ${r.servUnit==='personnes'?'selected':''}>👥 Personnes</option><option value="sandwichs" ${r.servUnit==='sandwichs'?'selected':''}>🥪 Sandwichs</option><option value="gaufres" ${r.servUnit==='gaufres'?'selected':''}>🧇 Gaufres</option><option value="parts" ${r.servUnit==='parts'?'selected':''}>🍰 Parts</option><option value="biscuits" ${r.servUnit==='biscuits'?'selected':''}>🍪 Biscuits</option><option value="crepes" ${r.servUnit==='crepes'?'selected':''}>🥞 Crêpes</option><option value="donuts" ${r.servUnit==='donuts'?'selected':''}>🍩 Donuts</option><option value="pots" ${r.servUnit==='pots'?'selected':' function parseIngredient(s){let m=String(s||'').trim().match(/^([\d.,]+)\s*(kg|g|mg|l|cl|ml|c\.?\s*à\s*(?:s|c)|cuill(?:ère|eres|ères|ères?)|unité[s]?|x)\b\s*(.*)$/i);if(!m)return{amount:1,unit:'x',name:keyFromIngredient(s)};let unit=m[2].toLowerCase().replace(/\s+/g,' ');return{amount:Number(m[1].replace(',','.')),unit,name:m[3].trim()}}
function normalizeFoodName(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function toggleIngredientUsed(recipeId,index,checked){
  let r=state.recipes.find(x=>x.id===recipeId); if(!r)return;
  r.used=r.used||{};
  if(checked) r.used[index]=true; else delete r.used[index];
  save();
  openRecipe(recipeId);
}
function ingredientName(s){return keyFromIngredient(s).toLowerCase()}
function keyFromIngredient(s){return String(s||'').replace(/^\s*[\d.,]+\s*(kg|g|mg|l|cl|ml|c\.?\s*à\s*(s|c)|cuillère[s]?[^ ]*|unité[s]?|x)\s*/i,'').trim()}
function sameFood(a,b){a=String(a).toLowerCase().trim();b=String(b).toLowerCase().trim();return a===b||a.includes(b)||b.includes(a)}
function addRecipeToStock(id){let r=state.recipes.find(x=>x.id===id);if(!r)return;r.photos=Array.isArray(r.photos)?r.photos:(r.photo?[r.photo]:[]);let img=photoSrc(r.photos[1]||r.photos[0]||'');document.getElementById('modal').innerHTML=`<h2>🧊 Mettre ${esc(r.name)} dans le stock</h2>${img?`<img src="${img}" alt="" style="width:100%;height:170px;object-fit:cover;border-radius:16px;margin-bottom:12px">`:''}<div class="field"><label>Catégorie / emplacement</label><select id="sPlace"><option ${r.keepPlace==='Réfrigérateur'?'selected':''}>Réfrigérateur</option><option ${r.keepPlace==='Congélateur'?'selected':''}>Congélateur</option><option ${r.keepPlace==='Placard'?'selected':''}>Placard</option></select></div><div class="field" style="margin-top:10px"><label>Quantité / portions</label><input id="sQty" type="number" min="1" value="1"></div><div class="notif" style="margin-top:12px">⏳ Conservation : <b>${r.keep} ${r.keepUnit}</b><br>📅 Date de fin calculée automatiquement à partir d'aujourd'hui : <b>${fmtDate(addKeepToDate(new Date(),r.keep,r.keepUnit).toISOString().slice(0,10))}</b></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveRecipeStock(${r.id})">Ajouter au stock</button></div>`;showModal()}
function addKeepToDate(d,value,unit){value=Number(value)||0;if(unit==='jours')d.setDate(d.getDate()+value);else if(unit==='semaines')d.setDate(d.getDate()+value*7);else if(unit==='mois')d.setMonth(d.getMonth()+value);else if(unit==='année'||unit==='années')d.setFullYear(d.getFullYear()+value);return d}
function saveRecipeStock(id){let r=state.recipes.find(x=>x.id===id),qty=Number(document.getElementById('sQty').value)||1,place=document.getElementById('sPlace').value;let d=new Date();addKeepToDate(d,r.keep,r.keepUnit);state.stock.push({id:Date.now(),name:r.name,place,qty,unit:'portion(s)',date:d.toISOString().slice(0,10),days:r.keep,keep:r.keep,keepUnit:r.keepUnit,keepPlace:r.keepPlace,emoji:r.emoji||'🍽️',photo:(r.photos?.[1]||r.photos?.[0]||r.photo||'')});save();closeModal();toast('Recette ajoutée au stock');switchView('stock')}
function addRecipeToShopping(id){let r=state.recipes.find(x=>x.id===id);r.ingredients.forEach(i=>state.shopping.push({id:Date.now()+Math.random(),name:i.replace(/^\d+[.,]?\d*\s*(g|kg|ml|cl|L|c\. à s\.)?\s*/i,''),qty:1,price:0,done:false}));save();closeModal();toast('Ingrédients ajoutés aux courses');switchView('shopping')}
function prefillAgenda(id){let r=state.recipes.find(x=>x.id===id);closeModal();openAgendaModal(r)}
function syncStockExpiryAgenda(){
  const today=new Date(); today.setHours(0,0,0,0);
  let changed=false;
  for(const x of state.stock){
    if(!x?.id||!x.date)continue;
    const expiry=new Date(x.date+'T00:00:00');
    if(Number.isNaN(expiry.getTime()))continue;
    expiry.setHours(0,0,0,0);
    const days=Math.ceil((expiry-today)/86400000);
    if(days>=0&&days<=1){
      const exists=state.agenda.some(a=>a.type==='stock-expiry'&&Number(a.stockId)===Number(x.id)&&a.date===x.date);
      if(!exists){
        state.agenda.push({
          id:Date.now()+Math.random(),
          type:'stock-expiry',
          stockId:x.id,
          recipeId:null,
          name:`‼️ ${x.name} — à consommer`,
          date:x.date,
          moment:'Midi',
          time:'12:00',
          duration:0,
          advisedTime:'12:00',
          notifyTime:'12:00',
          photo:x.photo||''
        });
        changed=true;
      }
    }
  }
  if(changed)save();
  return changed;
}
function renderStock(){let q=(document.getElementById('stockSearch')?.value||'').toLowerCase();let groups=['Réfrigérateur','Congélateur','Placard'];document.getElementById('stockList').innerHTML=groups.filter(g=>stockFilter==='all'||g===stockFilter).map(g=>{let a=state.stock.filter(x=>x.place===g&&x.name.toLowerCase().includes(q));if(!a.length)return '';return `<div class="stock-group"><div class="stock-title"><span>${g==='Congélateur'?'❄️':g==='Réfrigérateur'?'🧊':'🏠'} ${g}</span><span>${a.length}</span></div>${a.map(x=>{let days=daysLeft(x.date),cl=days<=1?'danger':days<=3?'warn':'';return `<div class="stock-item clickable" onclick="openStockEdit(${x.id})">${photoSrc(x.photo)?`<img src="${photoSrc(x.photo)}" style="width:56px;height:56px;border-radius:14px;object-fit:cover">`:`<div class="stock-icon">${x.emoji||'📦'}</div>`}<div class="stock-info"><strong>${esc(x.name)}</strong><small>DDM/DLC : ${fmtDate(x.date)} · ${x.qty}${x.unit||'x'}${x.keep?` · Conservation ${x.keep} ${x.keepUnit}`:''}</small></div><span class="pill ${cl}">${days<0?'Dépassé':days===0?'Aujourd’hui':days+' jour'+(days>1?'s':'')}</span><button class="btn ghost" onclick="event.stopPropagation();consumeStock(${x.id})">−</button></div>`}).join('')}</div>`}).join('')||'<div class="empty">Ton stock est vide.</div>'}
function openStockEdit(id){let x=state.stock.find(s=>s.id===id);if(!x)return;openStockModal({...x,editId:id})}

function daysLeft(s){let a=new Date();a.setHours(0,0,0,0);let b=new Date(s);b.setHours(0,0,0,0);return Math.ceil((b-a)/86400000)}
function consumeStock(id){let x=state.stock.find(s=>s.id===id);if(!x)return;x.qty=Number(x.qty)-1;if(x.qty<=0){state.stock=state.stock.filter(s=>s.id!==id);state.agenda=state.agenda.filter(a=>Number(a.stockId)!==Number(id)&&String(a.name||'').replace(/^‼️\s*/,'').trim()!==String(x.name||'').trim());}save();renderStock();renderAgenda();updateReminder();toast(x.qty<=0?'Aliment retiré du stock et de l’agenda':'Stock mis à jour')}

    <div class="field"><label>Quantité</label><input id="sq" type="number" min="0.01" step="0.01" value="${x.qty??1}"></div>

    <div class="field"><label>Unité de conservation</label><select id="sku"><option ${x.keepUnit==='jours'||!x.keepUnit?'selected':''}>jours</option><option ${x.keepUnit==='semaines'?'selected':''}>semaines</option><option ${x.keepUnit==='mois'?'selected':''}>mois</option><option ${x.keepUnit==='années'?'selected':''}>années</option></select></div>
    <div class="field full"><label>Date limite</label><input id="sd" type="date" value="${x.date||''}"></div>
    <div class="field full"><label>Photo (facultatif)</label><input id="sphoto" type="file" accept="image/*" onchange="previewStockImage(event)"><img id="sphotoPreview" class="stock-photo-preview" alt="Aperçu" style="display:${photoSrc(x.photo)?'block':'none'}" src="${photoSrc(x.photo)||''}"></div>
  </div>
  <p class="small">Tu peux saisir n’importe quel ingrédient ou produit. La date est calculée automatiquement si tu renseignes une durée de conservation, mais tu peux aussi la modifier directement.</p>
  <div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" id="stockSaveBtn" onclick="saveStock(null,${x.editId||'null'})">${isEdit?'Enregistrer les modifications':'Ajouter au stock'}</button></div>`;
  showModal();

function resizeRecipeImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let max=1000,w=im.width,h=im.height;if(Math.max(w,h)>max){if(w>=h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',0.78))};im.onerror=reject;im.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
async function saveRecipe(editId){let name=document.getElementById('rn').value.trim();if(!name)return toast('Indique un nom');let files=Array.from(document.getElementById('rphoto')?.files||[]).slice(0,2),photos=[];try{for(const file of files){const data=await resizeRecipeImage(file);photos.push(await putPhoto(data))}}catch(e){console.error(e);return toast('Impossible d’enregistrer cette photo')}let old=editId?state.recipes.find(x=>x.id===editId):null;let oldPhotos=old?(Array.isArray(old.photos)?old.photos:(old.photo?[old.photo]:[])):[];let data={name,cat:document.getElementById('rc').value,emoji:'',prep:Number(document.getElementById('rp').value)||0,cook:Number(document.getElementById('rcu').value)||0,serv:Number(document.getElementById('rs').value)||1,servUnit:document.getElementById('rsu').value||'personnes',cost:Number(document.getElementById('rco').value)||0,keep:Number(document.getElementById('rk').value)||0,keepUnit:document.getElementById('rku').value,keepPlace:document.getElementById('rkp').value,ingredients:document.getElementById('ri').value.split('\n').map(x=>x.trim()),steps:document.getElementById('rst').value.split('\n').map(x=>x.trim())};if(editId){let r=old;if(!r)return;Object.assign(r,data);if(files.length){r.photos=photos;r.photo=photos[0]||''}else{r.photos=oldPhotos;r.photo=oldPhotos[0]||''}save();closeModal();renderRecipes();toast('Recette modifiée ✨');openRecipe(editId)}else{state.recipes.push({id:Date.now(),...data,photos,photo:photos[0]||'',used:{}});save();closeModal();renderRecipes();toast(photos.length?'Recette créée avec ses photos 📷':'Recette créée')}}

function openSettings(){document.getElementById('modal').innerHTML=`<h2>⚙️ Paramètres</h2><h3 style="margin:10px 0 6px">🍽️ Historique des repas</h3><div id="mealHistorySettings"></div><h3 style="margin:10px 0 6px">📖 Catégories des recettes</h3><div id="recipeCatSettings"></div><div class="actions" style="justify-content:flex-start;margin:6px 0"><button class="btn purple" onclick="addCategory('recipe')">＋ Ajouter</button></div><h3 style="margin:10px 0 6px">🛒 Catégories des courses</h3><div id="shopCatSettings"></div><div class="actions" style="justify-content:flex-start;margin:6px 0"><button class="btn purple" onclick="addCategory('shopping')">＋ Ajouter</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="btn" onclick="requestNotifications()">🔔 Activer les notifications</button><button class="btn ghost" style="margin-left:8px" onclick="exportData()">Exporter mes données</button><div class="actions"><button class="btn ghost" onclick="closeModal()">Fermer</button></div>`;showModal();renderCategorySettings();renderMealHistorySettings()}
function renderCategorySettings(){let r=document.getElementById('recipeCatSettings'),s=document.getElementById('shopCatSettings');if(!r||!s)return;r.innerHTML=state.recipeCategories.map((c,i)=>`<div class="shop-item" style="border:1px solid var(--line);border-radius:9px;margin:3px 0;padding:5px 7px;min-height:34px"><div class="shop-name" style="font-weight:400">${esc(c)}</div><button class="btn ghost mini" style="padding:4px 7px" onclick="renameCategory('recipe',${i})">✏️</button><button class="btn ghost mini" style="padding:4px 7px" onclick="deleteCategory('recipe',${i})">🗑️</button></div>`).join('');s.innerHTML=state.shoppingCategories.map((c,i)=>`<div class="shop-item" style="border:1px solid var(--line);border-radius:9px;margin:3px 0;padding:5px 7px;min-height:34px"><div class="shop-name" style="font-weight:400">${esc(c)}</div><button class="btn ghost mini" style="padding:4px 7px" onclick="renameCategory('shopping',${i})">✏️</button><button class="btn ghost mini" style="padding:4px 7px" onclick="deleteCategory('shopping',${i})">🗑️</button></div>`).join('')}
function addCategory(type){let name=prompt('Nom de la nouvelle catégorie :');if(!name)return;name=name.trim();if(!name)return;let arr=type==='recipe'?state.recipeCategories:state.shoppingCategories;if(arr.some(x=>x.toLowerCase()===name.toLowerCase()))return toast('Cette catégorie existe déjà');arr.push(name);save();renderAll();openSettings();toast('Catégorie ajoutée')}
function renameCategory(type,index){let arr=type==='recipe'?state.recipeCategories:state.shoppingCategories,old=arr[index];let name=prompt('Nouveau nom de la catégorie :',old);if(!name)return;name=name.trim();if(!name||name===old)return;if(arr.some((x,i)=>i!==index&&x.toLowerCase()===name.toLowerCase()))return toast('Cette catégorie existe déjà');arr[index]=name;if(type==='recipe')state.recipes.forEach(r=>{if(r.cat===old)r.cat=name});else state.shopping.forEach(x=>{if(x.cat===old)x.cat=name});if(activeCat===old)activeCat=name;if(shoppingCatFilter===old)shoppingCatFilter=name;save();renderAll();openSettings();toast('Catégorie modifiée')}
function deleteCategory(type,index){let arr=type==='recipe'?state.recipeCategories:state.shoppingCategories;if(arr.length<=1)return toast('Garde au moins une catégorie');let old=arr[index];if(!confirm(`Supprimer « ${old} » ? Les éléments seront déplacés vers « Autre » si nécessaire.`))return;arr.splice(index,1);if(type==='recipe'){state.recipes.forEach(r=>{if(r.cat===old)r.cat=arr[0]||'Plat'});if(activeCat===old)activeCat='Toutes'}else{if(!state.shoppingCategories.includes('Autre'))state.shoppingCategories.push('Autre');state.shopping.forEach(x=>{if(x.cat===old)x.cat='Autre'});if(shoppingCatFilter===old)shoppingCatFilter='all'}save();renderAll();openSettings();toast('Catégorie supprimée')}
async function requestNotifications(){
 if(!('Notification' in window)) return toast('Notifications non disponibles sur cet appareil');
 if(!window.isSecureContext && location.hostname!=='localhost' && location.hostname!=='127.0.0.1') return showNotificationHelp('Mikadodo doit être ouvert depuis une connexion sécurisée (HTTPS) ou installé comme application.');
 if(Notification.permission==='granted'){
   try{if('serviceWorker' in navigator){let reg=await navigator.serviceWorker.ready;await reg.showNotification('Mikadodo',{body:'Les notifications sont bien activées ✅',tag:'mikadodo-test'});}else new Notification('Mikadodo',{body:'Les notifications sont bien activées ✅'});toast('Notifications déjà activées');}catch(e){toast('Impossible d’afficher le test');}
   return;
 }
 if(Notification.permission==='denied') return showNotificationHelp('Les notifications ont été bloquées par le navigateur. Il faut les autoriser dans les réglages du site, puis revenir ici.');
 try{
   let p=await Notification.requestPermission();
   if(p==='granted'){
     toast('Notifications activées ✅');
     try{if('serviceWorker' in navigator){let reg=await navigator.serviceWorker.ready;await reg.showNotification('Mikadodo',{body:'Notifications activées ✅',tag:'mikadodo-test'});}else new Notification('Mikadodo',{body:'Notifications activées ✅'});}catch(e){}
   }else if(p==='denied') showNotificationHelp('Le navigateur a refusé les notifications. Autorise-les dans les réglages du site, puis réessaie.');
   else toast('Autorisation non accordée');
 }catch(e){showNotificationHelp('Le navigateur ne permet pas actuellement les notifications. Vérifie les autorisations du site.');}
}
function showNotificationHelp(message){
 document.getElementById('modal').innerHTML=`<h2>🔔 Notifications</h2><p>${esc(message)}</p><div class="notif"><b>Sur Android / Chrome :</b><br>ouvre les informations du site → <b>Autorisations</b> → <b>Notifications</b> → <b>Autoriser</b>.</div><div class="notif"><b>Sur iPhone / iPad :</b><br>si Mikadodo est installé sur l’écran d’accueil, vérifie les réglages de notifications de l’app. Les notifications Web nécessitent une version compatible d’iOS/iPadOS.</div><p class="small">Une fois l’autorisation donnée, reviens dans Mikadodo et appuie à nouveau sur « Activer les notifications ».</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Fermer</button></div>`;showModal();
}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ma-cuisine-donnees.json';a.click()}
function removeMealHistory(id){state.mealHistory=state.mealHistory||[];state.mealHistory=state.mealHistory.filter(x=>x.id!==id);save();renderMealHistorySettings();toast('Repas supprimé de l’historique')}
function renderMealHistorySettings(){let el=document.getElementById('mealHistorySettings');if(!el)return;let today=localDateKey(new Date());let consumed=(state.mealHistory||[]).map(x=>({...x,consumed:true}));let past=state.agenda.filter(x=>x.date&&x.date<today).map(x=>({...x,consumed:false}));let history=[...consumed,...past].sort((a,b)=>(b.date+' '+normalizeTime(b.time)).localeCompare(a.date+' '+normalizeTime(a.time)));el.innerHTML=history.length?history.map(x=>`<div class="shop-item" style="padding:8px 0;border-bottom:1px solid var(--line);gap:8px"><div class="shop-name"><span>${esc(x.name)}</span><div class="small">${esc(fmtDate(x.date).replace(/\/\d{4}$/, ''))} · ${esc(normalizeTime(x.time).replace(':','h'))}${x.consumed?' · ✅ Consommé':''}</div></div>${x.consumed?`<button class="btn ghost mini" style="padding:4px 7px" onclick="removeMealHistory(${x.id})">🗑️</button>`:''}</div>`).join(''):'<div class="empty">Aucun repas dans l’historique pour le moment. 🍽️</div>'}
function renderNotes(){let el=document.getElementById('notesList');if(!el)return;el.innerHTML=state.notes.length?state.notes.map(n=>`<div class="note-item ${n.done?'done':''}"><input type="checkbox" ${n.done?'checked':''} onchange="toggleNote(${n.id})"><span>${esc(n.text)}</span><button class="btn ghost mini" onclick="removeNote(${n.id})">×</button></div>`).join(''):'<div class="empty">Aucune note pour le moment. 🌷</div>'}
function addNote(){let el=document.getElementById('noteInput'),text=el?.value.trim();if(!text)return;state.notes.push({id:Date.now(),text,done:false});save();el.value='';renderNotes();toast('Note ajoutée ✨')}
function toggleNote(id){let n=state.notes.find(x=>x.id===id);if(!n)return;n.done=!n.done;save();renderNotes()}
function removeNote(id){state.notes=state.notes.filter(x=>x.id!==id);save();renderNotes()}
function cycleRecipePhoto(id){let r=state.recipes.find(x=>x.id===id);if(!r)return;let photos=Array.isArray(r.photos)?r.photos:(r.photo?[r.photo]:[]);photos=photos.filter(Boolean);if(photos.length<2)return;let img=document.getElementById('recipeMainPhoto');if(!img)return;let current=parseInt(img.dataset.index||'0',10);if(Number.isNaN(current)||current<0||current>=photos.length)current=0;current=(current+1)%photos.length;img.dataset.index=String(current);img.setAttribute('src',photoSrc(photos[current])||'');let counter=img.parentElement?.querySelector('.photo-counter');if(counter)counter.textContent=`📷 ${current+1} / ${photos.length} — touche la photo pour défiler`}
function zoomPhoto(src){let z=document.getElementById('photoZoom'),im=document.getElementById('photoZoomImg');if(!z||!im)return;im.src=src;z.classList.add('show')}
function closePhotoZoom(){document.getElementById('photoZoom')?.classList.remove('show')}
let cookingTimer={end:0,name:'',minutes:0,interval:null,alarm:false,audio:null,audioTimer:null};
async function scheduleTimerInBackground(){try{if(!('serviceWorker' in navigator))return false;const reg=await navigator.serviceWorker.ready;if(!('showTrigger' in Notification.prototype)&&typeof TimestampTrigger==='undefined')return false;const trigger=typeof TimestampTrigger!=='undefined'?new TimestampTrigger(cookingTimer.end):new window.TimestampTrigger(cookingTimer.end);await reg.showNotification('⏰ Minuteur terminé',{body:`${cookingTimer.name||'La cuisson'} est terminée.`,tag:'mikadodo-cooking-timer',renotify:true,icon:'icon-512.png',badge:'icon-512.png',requireInteraction:true,actions:[{action:'restart',title:'🔄 Relancer'},{action:'stop',title:'⏹️ Éteindre'}],showTrigger:trigger,data:{type:'cooking-timer',minutes:cookingTimer.minutes,name:cookingTimer.name}});return true}catch(e){return false}}
function saveBackgroundTimer(){try{localStorage.setItem('mikadodo-cooking-timer',JSON.stringify({end:cookingTimer.end,name:cookingTimer.name,minutes:cookingTimer.minutes}))}catch(e){}}
function clearBackgroundTimer(){try{localStorage.removeItem('mikadodo-cooking-timer')}catch(e){}}
function restoreBackgroundTimer(){try{const raw=localStorage.getItem('mikadodo-cooking-timer');if(!raw)return;const x=JSON.parse(raw);if(!x||!x.end)return;if(Date.now()>=x.end){localStorage.removeItem('mikadodo-cooking-timer');return;}cookingTimer={end:x.end,name:x.name||'',minutes:Number(x.minutes)||0,interval:null,alarm:false,audio:null,audioTimer:null};renderCookingTimer();document.getElementById('timerBar')?.classList.add('show');cookingTimer.interval=setInterval(()=>{renderCookingTimer();if(Date.now()>=cookingTimer.end){clearInterval(cookingTimer.interval);cookingTimer.interval=null;document.getElementById('timerTime').textContent='00:00';showTimerAlarm();clearBackgroundTimer()}},1000)}catch(e){}}
function startCookingTimer(minutes,name){minutes=Number(minutes)||0;if(minutes<=0)return toast('Cette recette n’a pas de temps de cuisson');stopTimerAlarm(true);if(cookingTimer.interval)clearInterval(cookingTimer.interval);cookingTimer={end:Date.now()+minutes*60000,name:decodeURIComponent(name||''),minutes:minutes,interval:null,alarm:false,audio:null,audioTimer:null};saveBackgroundTimer();scheduleTimerInBackground();renderCookingTimer();cookingTimer.interval=setInterval(()=>{renderCookingTimer();if(Date.now()>=cookingTimer.end){clearInterval(cookingTimer.interval);cookingTimer.interval=null;document.getElementById('timerTime').textContent='00:00';showTimerAlarm();clearBackgroundTimer()}},1000);document.getElementById('timerBar').classList.add('show');toast(`Minuteur lancé : ${minutes} min`)}
function renderCookingTimer(){let sec=Math.max(0,Math.ceil((cookingTimer.end-Date.now())/1000));let m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');let el=document.getElementById('timerTime');if(el)el.textContent=`${m}:${s}`}
function showTimerAlarm(){cookingTimer.alarm=true;document.getElementById('timerBar')?.classList.add('show');document.getElementById('timerAlarmText').textContent=`${cookingTimer.name||'La cuisson'} est terminée.`;document.getElementById('timerAlarm').classList.add('show');startTimerSound()}
function startTimerSound(){stopTimerSound();try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let ctx=new C();cookingTimer.audio=ctx;let notes=[880,1046.5,1318.5,1046.5],step=0;let melody=()=>{if(!cookingTimer.alarm)return;let t=ctx.currentTime;let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=notes[step%notes.length];o.type='triangle';g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.42,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+.42);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.43);step++};melody();cookingTimer.audioTimer=setInterval(melody,500)}catch(e){}}
function stopTimerSound(){if(cookingTimer.audioTimer){clearInterval(cookingTimer.audioTimer);cookingTimer.audioTimer=null}if(cookingTimer.audio){try{cookingTimer.audio.close()}catch(e){}cookingTimer.audio=null}}
function stopTimerAlarm(silent=false){cookingTimer.alarm=false;stopTimerSound();document.getElementById('timerAlarm')?.classList.remove('show');if(!silent)toast('Minuteur arrêté')}
function restartCookingTimer(){let m=cookingTimer.minutes,n=cookingTimer.name;stopTimerAlarm(true);startCookingTimer(m,encodeURIComponent(n));}
function stopCookingTimer(){if(cookingTimer.interval)clearInterval(cookingTimer.interval);clearBackgroundTimer();stopTimerAlarm(true);cookingTimer={end:0,name:'',minutes:0,interval:null,alarm:false,audio:null,audioTimer:null};document.getElementById('timerBar')?.classList.remove('show');toast('Minuteur arrêté')}
function showModal(){document.getElementById('modalBack').classList.add('show');if(!history.state?.modal){history.pushState({mikadodo:true,view:currentView,modal:true},'',`#${currentView}-modal`)}}
function closeModal(fromHistory=false){document.getElementById('modalBack').classList.remove('show');document.getElementById('modal').className='modal';if(!fromHistory&&history.state?.modal)history.back()}
let notificationTimer=null;
function notificationKey(x){return `mikadodo-notif:${x.id}:${x.date}:${x.notifyTime||startTime(x.time,x.duration)}`}
function wasNotificationSent(x){try{return localStorage.getItem(notificationKey(x))==='1'}catch(e){return false}}
function markNotificationSent(x){try{localStorage.setItem(notificationKey(x),'1')}catch(e){}}
async function showAgendaNotification(x){
  if(!('Notification' in window)||Notification.permission!=='granted')return false;
  const notifyTime=x.notifyTime||startTime(x.time,x.duration);
  const body=x.type==='stock-expiry'?`‼️ ${x.name.replace(/^‼️\s*/,'')} — à consommer aujourd’hui à 12h.`:`${x.name} — rappel à ${notifyTime}. Repas à ${x.time}.`;
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.ready;
      await reg.showNotification('Mikadodo',{body,tag:`agenda-${x.id}`,renotify:true,icon:'icon-512.png',badge:'icon-512.png',data:{agendaId:x.id}});
      return true;
    }
  }catch(e){}
  return false;
}
async function checkNotifications(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=Date.now();
  for(const x of state.agenda){
    const notifyTime=x.notifyTime||startTime(x.time,x.duration);
    const t=new Date(`${x.date}T${notifyTime}:00`).getTime();
    // Autorise un petit retard (jusqu'à 2 minutes) si Chrome a suspendu la page.
    if(!Number.isNaN(t)&&t<=now&&now-t<=120000&&!wasNotificationSent(x)){
      if(await showAgendaNotification(x))markNotificationSent(x);
    }
  }
}
function scheduleNotificationCheck(){
  if(notificationTimer)clearTimeout(notificationTimer);
  let next=Infinity,now=Date.now();
  state.agenda.forEach(x=>{
    const t=new Date(`${x.date}T${x.notifyTime||startTime(x.time,x.duration)}:00`).getTime();
    if(t>now&&!wasNotificationSent(x)&&t<next)next=t;
  });
  if(next<Infinity)notificationTimer=setTimeout(()=>{checkNotifications().finally(scheduleNotificationCheck)},Math.max(1000,next-now));
}
setInterval(()=>{if(syncStockExpiryAgenda()){renderAgenda();updateReminder()}renderStock();checkNotifications();scheduleNotificationCheck()},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkNotifications();scheduleNotificationCheck()}});
window.addEventListener('focus',()=>{checkNotifications();scheduleNotificationCheck()});
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>reg.update()).catch(()=>{});
}
navigator.serviceWorker?.addEventListener('message',e=>{if(e.data?.type==='restart-cooking-timer'){try{const x=JSON.parse(localStorage.getItem('mikadodo-cooking-timer')||'null');if(x&&x.minutes)startCookingTimer(x.minutes,encodeURIComponent(x.name||''));}catch(err){}}});
initPhotoStorage().then(()=>{renderAll();restoreBackgroundTimer()});
checkNotifications();
scheduleNotificationCheck();
</script>
