<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#E8A7B8"/>
<link rel="manifest" href="manifest.webmanifest"/>
<title>Mikadodo</title>
<style>
:root{--green:#E8A7B8;--green2:#FCEFF3;--purple:#D889A1;--purple2:#F9E6EC;--ink:#292326;--muted:#7D7478;--line:#EEE3E7;--bg:#FFFBFC;--danger:#D86B7A;--warning:#D9A35B;--shadow:0 4px 16px rgba(105,72,84,.10)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;padding-bottom:76px}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.hero{height:145px;background:linear-gradient(135deg,#F3C7D2,#E8A7B8);display:flex;align-items:flex-end;padding:18px 18px 20px;color:#fff;position:relative}.hero h1{margin:0;font-size:30px}.hero p{margin:3px 0 0;opacity:.9}.hero .gear{position:absolute;right:18px;bottom:20px;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:45px;height:45px;font-size:22px}.tabs{display:flex;overflow:auto;background:#fff}.tab{padding:14px 18px;white-space:nowrap;color:#777;font-weight:700;border-bottom:3px solid transparent}.tab.active{color:var(--green);border-color:var(--green)}main{max-width:900px;margin:auto;padding:18px}.view{display:none}.view.active{display:block}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 14px}.section-head h2{margin:0;font-size:24px}.btn{background:var(--green);color:#fff;padding:11px 16px;border-radius:13px;font-weight:800}.btn.purple{background:var(--purple)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:14px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.chip{padding:9px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);white-space:nowrap}.chip.active{background:var(--purple);color:#fff;border-color:var(--purple)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.recipe-photo{height:125px;background:linear-gradient(135deg,#e8d2aa,#f6f0df);display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}.recipe-photo img{width:100%;height:100%;object-fit:cover}.photo-preview{width:100%;height:180px;border-radius:16px;object-fit:cover;display:none;border:1px solid var(--line);margin-top:8px}.photo-help{background:var(--green2);border-radius:12px;padding:10px;color:#B65F78;font-size:13px}.card-body{padding:14px}.card h3{margin:0 0 6px;font-size:19px}.meta{color:var(--muted);font-size:14px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--green2);color:#B65F78;font-weight:800;font-size:13px}.pill.warn{background:#fff3d8;color:#a56b00}.pill.danger{background:#ffe0e0;color:#b52e2e}.stock-group{margin:18px 0}.stock-title{display:flex;justify-content:space-between;align-items:center;background:var(--green2);padding:12px 14px;border-radius:15px 15px 0 0;font-weight:900}.stock-item{background:#fff;border-radius:15px;margin:9px 0;padding:13px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}.stock-icon{width:56px;height:56px;border-radius:14px;background:#F8E3EA;display:flex;align-items:center;justify-content:center;font-size:30px}.stock-info{flex:1}.stock-info strong{display:block;font-size:18px}.stock-info small{display:block;color:var(--muted);margin-top:3px}.price{font-weight:900}.calendar{display:grid;gap:10px}.day{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:14px}.day h3{margin:0 0 10px}.meal{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.meal:first-of-type{border-top:0}.meal .time{width:54px;font-weight:900;color:var(--purple)}.meal-info{flex:1}.meal-info strong{display:block}.meal-info small{color:var(--muted)}.shopping-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.summary{background:#fff;border-radius:15px;padding:12px;box-shadow:var(--shadow)}.summary small{display:block;color:var(--muted)}.summary strong{font-size:20px}.shop-item{display:flex;align-items:center;gap:12px;background:#fff;padding:14px;border-bottom:1px solid var(--line)}.shop-item:first-child{border-radius:15px 15px 0 0}.shop-item:last-child{border-radius:0 0 15px 15px}.check{width:25px;height:25px;border:2px solid #378de5;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:#fff}.check.on{background:#378de5}.shop-name{flex:1}.shop-name.done{text-decoration:line-through;color:#999}.shop-price{font-weight:800}.empty{background:#fff;border:1px dashed #ccc;border-radius:18px;padding:28px;text-align:center;color:var(--muted)}.fab{position:fixed;right:18px;bottom:88px;background:var(--green);color:#fff;border-radius:999px;padding:14px 20px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:15}.bottom{position:fixed;bottom:0;left:0;right:0;height:72px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30}.bottom button{flex:1;background:#fff;color:#888;font-weight:800}.bottom button.active{color:var(--green)}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal-back.show{display:flex}.modal{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.modal.recipe-full{width:100%;max-width:none;height:100vh;max-height:100vh;border-radius:0;padding:18px;overflow:auto}.modal.recipe-full .recipe-detail-photo{max-height:340px}.ingredient-list{list-style:none;padding:0;margin:0}.ingredient-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ingredient-row input{width:22px;height:22px;accent-color:var(--purple)}.ingredient-row.used span{text-decoration:line-through;color:#999}.stock-photo-preview{width:100%;height:160px;border-radius:16px;object-fit:cover;display:none;border:1px solid var(--line);margin-top:8px}.shop-actions{display:flex;gap:6px;align-items:center}.btn.mini{padding:8px 10px;border-radius:10px;font-size:13px}.modal h2{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:999px;z-index:80;display:none}.toast.show{display:block}.notif{background:#fff4cf;border-left:5px solid var(--warning);padding:13px;border-radius:12px;margin:10px 0}.small{font-size:13px;color:var(--muted)}
@media(max-width:600px){main{padding:14px}.hero{height:125px}.hero h1{font-size:26px}.grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.shopping-summary{grid-template-columns:1fr 1fr}.shopping-summary .summary:last-child{grid-column:1/-1}.recipe-photo{height:105px}.card-body{padding:11px}.card h3{font-size:16px}.fab{bottom:84px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="hero"><div><h1>🍴 Mikadodo</h1><p>Recettes · Stock · Courses · Agenda</p></div><button class="gear" onclick="openSettings()">⚙️</button></div>
  <nav class="tabs">
    <button class="tab active" data-view="recipes">📖 Recettes</button><button class="tab" data-view="stock">🧊 Mon stock</button><button class="tab" data-view="agenda">📅 Agenda</button><button class="tab" data-view="shopping">🛒 Courses</button>
  </nav>
</header>
<main>
<section id="recipes" class="view active">
 <div class="section-head"><h2>Mes recettes</h2><button class="btn purple" onclick="openRecipeModal()">＋ Recette</button></div>
 <input id="recipeSearch" class="search" placeholder="🔍 Rechercher une recette, un ingrédient…" oninput="renderRecipes()"/>
 <div id="recipeChips" class="chips"></div><div id="recipeGrid" class="grid"></div>
</section>
<section id="stock" class="view">
 <div class="section-head"><h2>Mon stock</h2><button class="btn" onclick="openStockModal()">＋ Ajouter</button></div>
 <input id="stockSearch" class="search" placeholder="🔍 Rechercher par nom ou marque…" oninput="renderStock()"/>
 <div class="chips"><button class="chip active" onclick="stockFilter='all';renderStock()">Tout</button><button class="chip" onclick="stockFilter='Réfrigérateur';renderStock()">🧊 Réfrigérateur</button><button class="chip" onclick="stockFilter='Congélateur';renderStock()">❄️ Congélateur</button><button class="chip" onclick="stockFilter='Placard';renderStock()">🏠 Placard</button></div>
 <div id="stockList"></div>
</section>
<section id="agenda" class="view">
 <div class="section-head"><h2>Agenda des repas</h2><button class="btn" onclick="openAgendaModal()">＋ Repas</button></div>
 <div class="notif" id="nextReminder">🔔 Les rappels de préparation apparaîtront ici.</div>
 <div id="calendar" class="calendar"></div>
</section>
<section id="shopping" class="view">
 <div class="section-head"><h2>Liste de courses</h2><button class="btn" onclick="openShopModal()">＋ Article</button></div>
 <div class="shopping-summary"><div class="summary"><small>Pas acheté</small><strong id="notBought">0 €</strong></div><div class="summary"><small>Acheté</small><strong id="bought">0 €</strong></div><div class="summary"><small>Total</small><strong id="total">0 €</strong></div></div>
 <div id="shopList"></div>
</section>
</main>
<button class="fab" id="fab" onclick="quickAdd()">＋ Ajouter</button>
<nav class="bottom"><button class="active" data-view="recipes">📖<br>Recettes</button><button data-view="stock">🧊<br>Stock</button><button data-view="agenda">📅<br>Agenda</button><button data-view="shopping">🛒<br>Courses</button></nav>
</div>
<div id="modalBack" class="modal-back" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='maCuisineV1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 recipes:[
  {id:1,name:'Hachis parmentier',cat:'Plat',prep:20,cook:30,serv:4,cost:11.8,keep:3,keepUnit:'jours',keepPlace:'Réfrigérateur',emoji:'🥔',ingredients:['500 g viande hachée','1 kg pommes de terre','50 cl lait','50 g beurre','100 g fromage'],steps:['Préparer la purée.','Faire revenir la viande.','Assembler dans un plat.','Ajouter le fromage puis cuire 30 min.']},
  {id:2,name:'Couscous',cat:'Plat',prep:30,cook:60,serv:4,cost:12,keep:3,keepUnit:'jours',keepPlace:'Réfrigérateur',emoji:'🍲',ingredients:['500 g agneau ou bœuf','100 g poulet','100 ml coulis de tomate','1,2 L eau','3 patates','2 carottes','2 navets','200 g pois chiche','300 g semoule','2 c. à s. huile d’olive'],steps:['Préparer la viande et les légumes.','Faire mijoter le bouillon.','Préparer la semoule.','Servir chaud.']},
  {id:3,name:'Mousse au chocolat',cat:'Dessert',prep:20,cook:0,serv:4,cost:4.5,keep:2,keepUnit:'jours',keepPlace:'Réfrigérateur',emoji:'🍫',ingredients:['200 g chocolat','4 œufs','1 pincée de sel'],steps:['Faire fondre le chocolat.','Séparer les blancs des jaunes.','Monter les blancs en neige.','Incorporer délicatement.']}
 ],
 stock:[{id:101,name:'Muffins',place:'Congélateur',qty:1,unit:'x',date:'2026-11-01',days:null,emoji:'🧁'},{id:102,name:'Pesto',place:'Congélateur',qty:2,unit:'x',date:'2026-12-01',days:null,emoji:'🌿'},{id:103,name:'Lait',place:'Réfrigérateur',qty:2,unit:'L',date:'2026-09-14',days:null,emoji:'🥛'}],
 shopping:[{id:201,name:'Lait',qty:2,price:1.5,done:false,cat:'Produits laitiers'},{id:202,name:'Tomates',qty:1,price:1,done:false,cat:'Fruits et légumes'},{id:203,name:'Pain',qty:1,price:1,done:false,cat:'Épicerie'}],
 agenda:[],
 recipeCategories:['Petit-déjeuner','Entrée','Salade','Soupe','Plat','Accompagnement','Sandwich','Dessert','Boisson','Goûter','Apéritif'],
 shoppingCategories:['Fruits et légumes','Viandes','Poissons','Produits laitiers','Épicerie','Surgelés','Boissons','Hygiène','Maison','Autre']
};
state.recipeCategories=state.recipeCategories||['Petit-déjeuner','Entrée','Salade','Soupe','Plat','Accompagnement','Sandwich','Dessert','Boisson','Goûter','Apéritif'];
state.shoppingCategories=state.shoppingCategories||['Fruits et légumes','Viandes','Poissons','Produits laitiers','Épicerie','Surgelés','Boissons','Hygiène','Maison','Autre'];
state.shopping.forEach(x=>x.cat=x.cat||'Autre');
state.recipes.forEach(r=>{r.used=r.used||{};r.usedStock=r.usedStock||{}});state.stock.forEach(x=>x.photo=x.photo||'');
state.agenda.forEach(x=>{x.notifyTime=x.notifyTime||startTime(x.time,x.duration||0)});
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function money(n){return (Number(n)||0).toFixed(2).replace('.',',')+' €'}function fmtDate(d){return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function switchView(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));document.getElementById('fab').style.display=v==='recipes'?'block':'none';renderAll()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
function renderAll(){renderRecipes();renderStock();renderAgenda();renderShopping();updateReminder()}
const cats=()=>['Toutes',...state.recipeCategories];let activeCat='Toutes',stockFilter='all',shoppingCatFilter='all';
function renderRecipes(){let q=(document.getElementById('recipeSearch')?.value||'').toLowerCase();document.getElementById('recipeChips').innerHTML=cats().map(c=>`<button class="chip ${activeCat===c?'active':''}" onclick="setRecipeCategory('${encodeURIComponent(c)}')">${esc(c)}</button>`).join('');let a=state.recipes.filter(r=>(activeCat==='Toutes'||r.cat===activeCat)&&(!q||r.name.toLowerCase().includes(q)||r.ingredients.join(' ').toLowerCase().includes(q)));document.getElementById('recipeGrid').innerHTML=a.length?a.map(r=>`<article class="card"><div class="recipe-photo">${r.photo?`<img src="${r.photo}" alt="" loading="lazy">`:(r.emoji||'🍽️')}</div><div class="card-body"><div class="row"><span class="pill">${esc(r.cat)}</span><span class="small">${r.prep+r.cook} min</span></div><h3>${esc(r.name)}</h3><div class="meta">👥 ${r.serv} pers. · 💰 ${money(r.cost)}</div><div class="row" style="margin-top:10px"><span class="small">🧊 ${r.keep} ${r.keepUnit} · ${esc(r.keepPlace)}</span><button class="btn purple" onclick="openRecipe(${r.id})">Ouvrir</button></div></div></article>`).join(''):'<div class="empty">Aucune recette trouvée.</div>'}
function openRecipe(id){let r=state.recipes.find(x=>x.id===id);if(!r)return;r.used=r.used||{};document.getElementById('modal').className='modal recipe-full';document.getElementById('modal').innerHTML=`<div class="row"><button class="btn ghost" onclick="closeModal()">← Retour</button><div class="shop-actions"><button class="btn ghost" onclick="openRecipeEdit(${r.id})">✏️ Modifier</button></div></div>${r.photo?`<img class="recipe-detail-photo" src="${r.photo}" alt="${esc(r.name)}" style="width:100%;object-fit:cover;border-radius:18px;margin:14px 0">`:''}<h2 style="font-size:30px;margin-bottom:6px">${r.emoji||'🍽️'} ${esc(r.name)}</h2><div class="meta">${esc(r.cat)} · 👥 ${r.serv} personnes · 💰 ${money(r.cost)}</div><p>⏱️ Préparation : <b>${r.prep} min</b><br>🔥 Cuisson : <b>${r.cook} min</b><br>⏱️ Total : <b>${r.prep+r.cook} min</b><br>🧊 Conservation : <b>${r.keep} ${r.keepUnit} au ${r.keepPlace.toLowerCase()}</b></p><h3>Ingrédients <span class="small">— coche quand tu l'utilises</span></h3><ul class="ingredient-list">${r.ingredients.map((i,n)=>`<li class="ingredient-row ${r.used[n]?'used':''}"><input type="checkbox" ${r.used[n]?'checked':''} onchange="toggleIngredientUsed(${r.id},${n},this.checked)"><span>${esc(i)}</span></li>`).join('')}</ul><h3>Préparation</h3><ol>${r.steps.map(s=>`<li style="margin:10px 0">${esc(s)}</li>`).join('')}</ol><div class="actions"><button class="btn" onclick="addRecipeToStock(${r.id})">🧊 Ajouter au stock</button><button class="btn purple" onclick="addRecipeToShopping(${r.id})">🛒 Courses</button><button class="btn" onclick="prefillAgenda(${r.id})">📅 Agenda</button></div>`;showModal()}
function openRecipeEdit(id){let r=state.recipes.find(x=>x.id===id);if(!r)return;document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML=`<h2>✏️ Modifier la recette</h2><div class="form-grid"><div class="field full"><label>Nom</label><input id="rn" value="${esc(r.name)}"></div><div class="field full"><label>Photo de la recette</label><input id="rphoto" type="file" accept="image/*" onchange="previewRecipeImage(event)"><div class="photo-help">📷 Choisis une nouvelle photo si tu veux remplacer l'actuelle.</div><img id="rphotoPreview" class="photo-preview" alt="Aperçu" style="display:${r.photo?'block':'none'}" src="${r.photo||''}"></div><div class="field"><label>Catégorie</label><select id="rc">${state.recipeCategories.map(x=>`<option ${r.cat===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Emoji</label><input id="re" value="${esc(r.emoji||'🍽️')}"></div><div class="field"><label>Préparation (min)</label><input id="rp" type="number" value="${r.prep}"></div><div class="field"><label>Cuisson (min)</label><input id="rcu" type="number" value="${r.cook}"></div><div class="field"><label>Personnes</label><input id="rs" type="number" value="${r.serv}"></div><div class="field"><label>Coût estimé (€)</label><input id="rco" type="number" step="0.01" value="${r.cost}"></div><div class="field"><label>Conservation</label><input id="rk" type="number" value="${r.keep}"></div><div class="field"><label>Unité</label><select id="rku"><option ${r.keepUnit==='jours'?'selected':''}>jours</option><option ${r.keepUnit==='semaines'?'selected':''}>semaines</option><option ${r.keepUnit==='mois'?'selected':''}>mois</option><option ${r.keepUnit==='années'?'selected':''}>années</option></select></div><div class="field"><label>Stockage</label><select id="rkp"><option ${r.keepPlace==='Réfrigérateur'?'selected':''}>Réfrigérateur</option><option ${r.keepPlace==='Congélateur'?'selected':''}>Congélateur</option><option ${r.keepPlace==='Placard'?'selected':''}>Placard</option></select></div><div class="field full"><label>Ingrédients (1 par ligne)</label><textarea id="ri" rows="7">${esc(r.ingredients.join('\n'))}</textarea></div><div class="field full"><label>Préparation (1 étape par ligne)</label><textarea id="rst" rows="7">${esc(r.steps.join('\n'))}</textarea></div></div><div class="actions"><button class="btn ghost" onclick="openRecipe(${r.id})">Annuler</button><button class="btn purple" onclick="saveRecipe(${r.id})">Enregistrer</button></div>`;showModal()}
function toggleIngredientUsed(recipeId,index,checked){let r=state.recipes.find(x=>x.id===recipeId);if(!r)return;r.used=r.used||{};if(checked){r.used[index]=true;let key=ingredientName(r.ingredients[index]);let stock=state.stock.find(s=>sameFood(s.name,key)&&Number(s.qty)>0);if(stock){stock.qty=Number(stock.qty)-1;r.usedStock=r.usedStock||{};r.usedStock[index]=stock.id;if(stock.qty<=0)state.stock=state.stock.filter(s=>s.id!==stock.id);toast(`${stock.name} retiré du stock`)}else toast('Ingrédient coché');}else{delete r.used[index];let sid=r.usedStock?.[index];if(sid){let stock=state.stock.find(s=>s.id===sid);if(stock)stock.qty=Number(stock.qty)+1;else state.stock.push({id:Date.now()+Math.random(),name:keyFromIngredient(r.ingredients[index]),place:'Réfrigérateur',qty:1,unit:'x',date:new Date().toISOString().slice(0,10),emoji:'📦'});delete r.usedStock[index];}save();}save();openRecipe(recipeId)}
function ingredientName(s){return keyFromIngredient(s).toLowerCase()}
function keyFromIngredient(s){return String(s||'').replace(/^\s*[\d.,]+\s*(kg|g|mg|l|cl|ml|c\.?\s*à\s*(s|c)|cuillère[s]?[^ ]*|unité[s]?|x)\s*/i,'').trim()}
function sameFood(a,b){a=String(a).toLowerCase().trim();b=String(b).toLowerCase().trim();return a===b||a.includes(b)||b.includes(a)}
function addRecipeToStock(id){let r=state.recipes.find(x=>x.id===id);document.getElementById('modal').innerHTML=`<h2>🧊 Ajouter ${esc(r.name)} au stock</h2><div class="field"><label>Emplacement</label><select id="sPlace"><option>Réfrigérateur</option><option>Congélateur</option><option>Placard</option></select></div><div class="field" style="margin-top:10px"><label>Quantité / portions</label><input id="sQty" type="number" min="1" value="1"></div><p class="small">Conservation automatique : ${r.keep} ${r.keepUnit}.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveRecipeStock(${r.id})">Ajouter</button></div>`}
function addKeepToDate(d,value,unit){value=Number(value)||0;if(unit==='jours')d.setDate(d.getDate()+value);else if(unit==='semaines')d.setDate(d.getDate()+value*7);else if(unit==='mois')d.setMonth(d.getMonth()+value);else if(unit==='années')d.setFullYear(d.getFullYear()+value);return d}
function saveRecipeStock(id){let r=state.recipes.find(x=>x.id===id),qty=Number(document.getElementById('sQty').value)||1,place=document.getElementById('sPlace').value;let d=new Date();addKeepToDate(d,r.keep,r.keepUnit);state.stock.push({id:Date.now(),name:r.name,place,qty,unit:'portion(s)',date:d.toISOString().slice(0,10),days:r.keep,emoji:r.emoji||'🍽️'});save();closeModal();toast('Recette ajoutée au stock');switchView('stock')}
function addRecipeToShopping(id){let r=state.recipes.find(x=>x.id===id);r.ingredients.forEach(i=>state.shopping.push({id:Date.now()+Math.random(),name:i.replace(/^\d+[.,]?\d*\s*(g|kg|ml|cl|L|c\. à s\.)?\s*/i,''),qty:1,price:0,done:false}));save();closeModal();toast('Ingrédients ajoutés aux courses');switchView('shopping')}
function prefillAgenda(id){let r=state.recipes.find(x=>x.id===id);closeModal();openAgendaModal(r)}
function renderStock(){let q=(document.getElementById('stockSearch')?.value||'').toLowerCase();let groups=['Réfrigérateur','Congélateur','Placard'];document.getElementById('stockList').innerHTML=groups.filter(g=>stockFilter==='all'||g===stockFilter).map(g=>{let a=state.stock.filter(x=>x.place===g&&x.name.toLowerCase().includes(q));if(!a.length)return '';return `<div class="stock-group"><div class="stock-title"><span>${g==='Congélateur'?'❄️':g==='Réfrigérateur'?'🧊':'🏠'} ${g}</span><span>${a.length}</span></div>${a.map(x=>{let days=daysLeft(x.date),cl=days<=1?'danger':days<=3?'warn':'';return `<div class="stock-item">${x.photo?`<img src="${x.photo}" style="width:56px;height:56px;border-radius:14px;object-fit:cover">`:`<div class="stock-icon">${x.emoji||'📦'}</div>`}<div class="stock-info"><strong>${esc(x.name)}</strong><small>DDM/DLC : ${fmtDate(x.date)} · ${x.qty}${x.unit||'x'}</small></div><span class="pill ${cl}">${days<0?'Dépassé':days===0?'Aujourd’hui':days+' jour'+(days>1?'s':'')}</span><button class="btn ghost" onclick="consumeStock(${x.id})">−</button></div>`}).join('')}</div>`}).join('')||'<div class="empty">Ton stock est vide.</div>'}
function daysLeft(s){let a=new Date();a.setHours(0,0,0,0);let b=new Date(s);b.setHours(0,0,0,0);return Math.ceil((b-a)/86400000)}
function consumeStock(id){let x=state.stock.find(s=>s.id===id);if(!x)return;x.qty=Number(x.qty)-1;if(x.qty<=0)state.stock=state.stock.filter(s=>s.id!==id);save();renderStock();toast('Stock mis à jour')}
function openStockModal(prefill){let x=prefill||{};document.getElementById('modal').innerHTML=`<h2>🧊 Ajouter au stock</h2><div class="form-grid"><div class="field"><label>Produit</label><input id="sn" value="${esc(x.name||'')}" placeholder="Ex. Poulet"></div><div class="field"><label>Emplacement</label><select id="sp"><option ${x.place==='Réfrigérateur'||!x.place?'selected':''}>Réfrigérateur</option><option ${x.place==='Congélateur'?'selected':''}>Congélateur</option><option ${x.place==='Placard'?'selected':''}>Placard</option></select></div><div class="field"><label>Quantité</label><input id="sq" type="number" min="1" value="${x.qty||1}"></div><div class="field"><label>Unité</label><input id="su" value="${esc(x.unit||'x')}"></div><div class="field"><label>Conservation</label><input id="sk" type="number" min="0" value="${x.keep||''}" placeholder="Ex. 1"></div><div class="field"><label>Unité</label><select id="sku"><option ${x.keepUnit==='jours'||!x.keepUnit?'selected':''}>jours</option><option ${x.keepUnit==='semaines'?'selected':''}>semaines</option><option ${x.keepUnit==='mois'?'selected':''}>mois</option><option ${x.keepUnit==='années'?'selected':''}>années</option></select></div><div class="field full"><label>Date limite calculée</label><input id="sd" type="date" value="${x.date||''}" readonly></div><div class="field"><label>Emoji</label><input id="se" value="${esc(x.emoji||'📦')}"></div><div class="field full"><label>Photo</label><input id="sphoto" type="file" accept="image/*" onchange="previewStockImage(event)"><img id="sphotoPreview" class="stock-photo-preview" alt="Aperçu"></div></div><p class="small">Exemple : Nouilles instantanées → Placard → Conservation : <b>1 année</b>. La date limite est calculée automatiquement à partir d'aujourd'hui.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveStock(${x.shopId||''})">Ajouter</button></div>`;showModal();setTimeout(()=>{document.getElementById('sk')?.addEventListener('input',updateStockKeepDate);document.getElementById('sku')?.addEventListener('change',updateStockKeepDate);updateStockKeepDate()},0)}
function previewStockImage(e){let f=e.target.files?.[0],img=document.getElementById('sphotoPreview');if(!f||!img)return;img.src=URL.createObjectURL(f);img.style.display='block'}
function updateStockKeepDate(){let k=Number(document.getElementById('sk')?.value)||0,u=document.getElementById('sku')?.value,d=document.getElementById('sd');if(!d)return;let x=new Date();if(k>0)addKeepToDate(x,k,u);d.value=k?x.toISOString().slice(0,10):''}

async function saveStock(shopId){let name=document.getElementById('sn').value.trim();if(!name)return toast('Indique un produit');let file=document.getElementById('sphoto')?.files?.[0],photo='';try{photo=await resizeRecipeImage(file)}catch(e){return toast('Impossible de lire cette photo')}let keep=Number(document.getElementById('sk').value)||0,keepUnit=document.getElementById('sku').value;let d=new Date();if(keep>0)addKeepToDate(d,keep,keepUnit);let date=keep>0?d.toISOString().slice(0,10):(document.getElementById('sd').value||new Date().toISOString().slice(0,10));state.stock.push({id:Date.now(),name,place:document.getElementById('sp').value,qty:Number(document.getElementById('sq').value)||1,unit:document.getElementById('su').value,date,keep,keepUnit,emoji:document.getElementById('se').value,photo});if(shopId){let sh=state.shopping.find(x=>x.id===Number(shopId));if(sh)sh.inStock=true}save();closeModal();renderStock();renderShopping();toast('Produit ajouté au stock')}
function renderAgenda(){let days=[...Array(7)].map((_,i)=>{let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+i);return d});document.getElementById('calendar').innerHTML=days.map(d=>{let key=d.toISOString().slice(0,10),items=state.agenda.filter(x=>x.date===key).sort((a,b)=>a.time.localeCompare(b.time));return `<div class="day"><h3>${d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</h3>${items.length?items.map(x=>`<div class="meal"><div class="time">${x.moment==='Matin'?'🌅':x.moment==='Midi'?'☀️':'🌙'}<br>${esc(x.time)}</div><div class="meal-info"><strong>${esc(x.name)}</strong><small>${x.duration} min · début conseillé ${startTime(x.time,x.duration)} · 🔔 ${esc(x.notifyTime||startTime(x.time,x.duration))}</small></div><div class="shop-actions"><button class="btn ghost mini" onclick="openAgendaEdit(${x.id})">✏️</button><button class="btn ghost mini" onclick="moveAgenda(${x.id})">↔️</button><button class="btn ghost mini" onclick="removeAgenda(${x.id})">🗑️</button></div></div>`).join(''):'<div class="small">Aucun repas</div>'}</div>`}).join('')}
function startTime(t,dur){let [h,m]=t.split(':').map(Number),n=h*60+m-Number(dur||0);n=(n+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function openAgendaModal(recipe){let opts=state.recipes.map(r=>`<option value="${r.id}" ${recipe?.id===r.id?'selected':''}>${esc(r.name)}</option>`).join('');let dur=recipe?recipe.prep+recipe.cook:50;let defaultTime='20:00';let defaultNotify=startTime(defaultTime,dur);document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML=`<h2>📅 Programmer un repas</h2><div class="form-grid"><div class="field full"><label>Recette</label><select id="ar" onchange="updateAgendaDuration()">${opts}</select></div><div class="field"><label>Date</label><input id="ad" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Moment</label><select id="am"><option>Matin</option><option>Midi</option><option>Soir</option></select></div><div class="field"><label>Heure du repas</label><input id="at" type="time" value="${defaultTime}" onchange="syncAgendaNotify()"></div><div class="field"><label>Durée totale (min)</label><input id="adu" type="number" value="${dur}" onchange="syncAgendaNotify()"></div><div class="field"><label>🔔 Notification</label><input id="ant" type="time" value="${defaultNotify}"></div></div><p class="small">Tu peux recevoir le rappel à l'heure que tu choisis. Par défaut, il est réglé sur l'heure de début conseillée.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveAgenda()">Programmer</button></div>`;showModal()}
function updateAgendaDuration(){let r=state.recipes.find(x=>x.id==document.getElementById('ar').value);let dur=r.prep+r.cook;document.getElementById('adu').value=dur;syncAgendaNotify()}
function syncAgendaNotify(){let at=document.getElementById('at'),adu=document.getElementById('adu'),ant=document.getElementById('ant');if(at&&adu&&ant)ant.value=startTime(at.value,adu.value)}
function saveAgenda(){let r=state.recipes.find(x=>x.id==document.getElementById('ar').value);let time=document.getElementById('at').value,duration=Number(document.getElementById('adu').value)||0;state.agenda.push({id:Date.now(),recipeId:r.id,name:r.name,date:document.getElementById('ad').value,moment:document.getElementById('am').value,time,duration,notifyTime:document.getElementById('ant').value||startTime(time,duration)});save();closeModal();renderAgenda();updateReminder();toast('Repas programmé')}
function openAgendaEdit(id){let x=state.agenda.find(a=>a.id===id);if(!x)return;let opts=state.recipes.map(r=>`<option value="${r.id}" ${x.recipeId===r.id||x.name===r.name?'selected':''}>${esc(r.name)}</option>`).join('');document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML=`<h2>✏️ Modifier le repas</h2><div class="form-grid"><div class="field full"><label>Recette</label><select id="ar" onchange="updateAgendaDuration()">${opts}</select></div><div class="field"><label>Date</label><input id="ad" type="date" value="${x.date}"></div><div class="field"><label>Moment</label><select id="am"><option ${x.moment==='Matin'?'selected':''}>Matin</option><option ${x.moment==='Midi'?'selected':''}>Midi</option><option ${x.moment==='Soir'?'selected':''}>Soir</option></select></div><div class="field"><label>Heure du repas</label><input id="at" type="time" value="${x.time}" onchange="syncAgendaNotify()"></div><div class="field"><label>Durée totale (min)</label><input id="adu" type="number" value="${x.duration}" onchange="syncAgendaNotify()"></div><div class="field"><label>🔔 Notification</label><input id="ant" type="time" value="${x.notifyTime||startTime(x.time,x.duration)}"></div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn danger" style="background:var(--danger)" onclick="removeAgenda(${x.id})">Supprimer</button><button class="btn" onclick="saveAgendaEdit(${x.id})">Enregistrer</button></div>`;showModal()}
function saveAgendaEdit(id){let x=state.agenda.find(a=>a.id===id);if(!x)return;let r=state.recipes.find(r=>r.id==document.getElementById('ar').value);if(!r)return;x.recipeId=r.id;x.name=r.name;x.date=document.getElementById('ad').value;x.moment=document.getElementById('am').value;x.time=document.getElementById('at').value;x.duration=Number(document.getElementById('adu').value)||0;x.notifyTime=document.getElementById('ant').value||startTime(x.time,x.duration);save();closeModal();renderAgenda();updateReminder();toast('Repas modifié ✨')}
function moveAgenda(id){let x=state.agenda.find(a=>a.id===id);if(!x)return;let date=prompt('Nouvelle date (AAAA-MM-JJ) :',x.date);if(!date)return;let time=prompt('Nouvelle heure (HH:MM) :',x.time);if(!time)return;x.date=date;x.time=time;x.notifyTime=prompt('Heure de notification (HH:MM) :',x.notifyTime||startTime(time,x.duration))||x.notifyTime||startTime(time,x.duration);save();renderAgenda();updateReminder();toast('Repas déplacé ↔️')}
function removeAgenda(id){state.agenda=state.agenda.filter(x=>x.id!==id);save();renderAgenda();updateReminder();toast('Repas supprimé') }
function updateReminder(){let now=new Date(),future=state.agenda.map(x=>({...x,dt:new Date(x.date+'T'+(x.notifyTime||startTime(x.time,x.duration))+':00')})).filter(x=>x.dt>now).sort((a,b)=>a.dt-b.dt)[0];document.getElementById('nextReminder').innerHTML=future?`🔔 <b>Prochain rappel :</b> ${esc(future.name)} à ${esc(future.notifyTime||startTime(future.time,future.duration))}. Repas à ${esc(future.time)}.`:'🔔 Aucun rappel programmé.'}
function setRecipeCategory(v){activeCat=decodeURIComponent(v);renderRecipes()}
function setShoppingCategory(v){shoppingCatFilter=decodeURIComponent(v);renderShopping()}
function renderShopping(){let nb=0,b=0;state.shopping.forEach(x=>x.done?b+=x.qty*x.price:nb+=x.qty*x.price);document.getElementById('notBought').textContent=money(nb);document.getElementById('bought').textContent=money(b);document.getElementById('total').textContent=money(nb+b);let catsToShow=shoppingCatFilter==='all'?state.shoppingCategories:[shoppingCatFilter];let html=state.shopping.length?catsToShow.map(cat=>{let items=state.shopping.filter(x=>(x.cat||'Autre')===cat);if(!items.length)return '';return `<div class="stock-group"><div class="stock-title"><span>🛒 ${esc(cat)}</span><span>${items.length}</span></div><div style="background:#fff;border-radius:0 0 15px 15px;box-shadow:var(--shadow);overflow:hidden">${items.map(x=>`<div class="shop-item"><button class="check ${x.done?'on':''}" onclick="toggleShop(${x.id})">${x.done?'✓':''}</button><div class="shop-name ${x.done?'done':''}"><b>${esc(x.name)}</b><div class="small">${x.qty} × ${money(x.price)}${x.inStock?' · 🧊 Au stock':''}</div></div><div class="shop-price">${money(x.qty*x.price)}</div><button class="btn ghost mini" onclick="openStockFromShopping(${x.id})">🧊 Stock</button><button class="btn ghost mini" onclick="removeShop(${x.id})">×</button></div>`).join('')}</div></div>`}).join(''):'<div class="empty">Ta liste de courses est vide.</div>';document.getElementById('shopList').innerHTML=`<div class="chips" style="margin-bottom:10px"><button class="chip ${shoppingCatFilter==='all'?'active':''}" onclick="shoppingCatFilter='all';renderShopping()">Toutes</button>${state.shoppingCategories.map(c=>`<button class="chip ${shoppingCatFilter===c?'active':''}" onclick="setShoppingCategory('${encodeURIComponent(c)}')">${esc(c)}</button>`).join('')}</div>${html}`}
function toggleShop(id){let x=state.shopping.find(s=>s.id===id);x.done=!x.done;save();renderShopping()}function removeShop(id){state.shopping=state.shopping.filter(x=>x.id!==id);save();renderShopping()}
function openStockFromShopping(id){let x=state.shopping.find(s=>s.id===id);if(!x)return;openStockModal({shopId:id,name:x.name,qty:x.qty,unit:'x'})}
function openShopModal(){document.getElementById('modal').innerHTML=`<h2>🛒 Ajouter un article</h2><div class="form-grid"><div class="field full"><label>Produit</label><input id="qn" placeholder="Ex. Lait"></div><div class="field"><label>Catégorie</label><select id="qcat">${state.shoppingCategories.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Quantité</label><input id="qq" type="number" min="1" value="1"></div><div class="field"><label>Prix unitaire</label><input id="qp" type="number" step="0.01" min="0" value="1"></div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveShop()">Ajouter</button></div>`;showModal()}
function saveShop(){let name=document.getElementById('qn').value.trim();if(!name)return toast('Indique un article');state.shopping.push({id:Date.now(),name,cat:document.getElementById('qcat').value,qty:Number(document.getElementById('qq').value)||1,price:Number(document.getElementById('qp').value)||0,done:false});save();closeModal();renderShopping();toast('Article ajouté')}
function quickAdd(){openRecipeModal()}
function openRecipeModal(){document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML=`<h2>📖 Nouvelle recette</h2><div class="form-grid"><div class="field full"><label>Nom</label><input id="rn"></div><div class="field full"><label>Photo de la recette</label><input id="rphoto" type="file" accept="image/*" onchange="previewRecipeImage(event)"><div class="photo-help">📷 Choisis une photo directement depuis la galerie de ton téléphone.</div><img id="rphotoPreview" class="photo-preview" alt="Aperçu de la recette"></div><div class="field"><label>Catégorie</label><select id="rc">${state.recipeCategories.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Emoji (si pas de photo)</label><input id="re" value="🍽️"></div><div class="field"><label>Préparation (min)</label><input id="rp" type="number" value="20"></div><div class="field"><label>Cuisson (min)</label><input id="rcu" type="number" value="30"></div><div class="field"><label>Personnes</label><input id="rs" type="number" value="4"></div><div class="field"><label>Coût estimé (€)</label><input id="rco" type="number" step="0.01" value="0"></div><div class="field"><label>Conservation</label><input id="rk" type="number" value="3"></div><div class="field"><label>Unité</label><select id="rku"><option>jours</option><option>semaines</option><option>mois</option><option>années</option></select></div><div class="field"><label>Stockage</label><select id="rkp"><option>Réfrigérateur</option><option>Congélateur</option><option>Placard</option></select></div><div class="field full"><label>Ingrédients (1 par ligne)</label><textarea id="ri" rows="5"></textarea></div><div class="field full"><label>Préparation (1 étape par ligne)</label><textarea id="rst" rows="5"></textarea></div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn purple" onclick="saveRecipe()">Créer</button></div>`;showModal()}
function previewRecipeImage(e){let f=e.target.files?.[0],img=document.getElementById('rphotoPreview');if(!f||!img)return;img.src=URL.createObjectURL(f);img.style.display='block'}
function resizeRecipeImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let max=1000,w=im.width,h=im.height;if(Math.max(w,h)>max){if(w>=h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',0.78))};im.onerror=reject;im.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
async function saveRecipe(editId){let name=document.getElementById('rn').value.trim();if(!name)return toast('Indique un nom');let file=document.getElementById('rphoto')?.files?.[0],photo='';try{photo=await resizeRecipeImage(file)}catch(e){return toast('Impossible de lire cette photo')}let data={name,cat:document.getElementById('rc').value,emoji:document.getElementById('re').value,prep:Number(document.getElementById('rp').value)||0,cook:Number(document.getElementById('rcu').value)||0,serv:Number(document.getElementById('rs').value)||1,cost:Number(document.getElementById('rco').value)||0,keep:Number(document.getElementById('rk').value)||0,keepUnit:document.getElementById('rku').value,keepPlace:document.getElementById('rkp').value,ingredients:document.getElementById('ri').value.split('\n').map(x=>x.trim()).filter(Boolean),steps:document.getElementById('rst').value.split('\n').map(x=>x.trim()).filter(Boolean)};if(editId){let r=state.recipes.find(x=>x.id===editId);if(!r)return;Object.assign(r,data);if(photo)r.photo=photo;save();closeModal();renderRecipes();toast('Recette modifiée ✨');openRecipe(editId)}else{state.recipes.push({id:Date.now(),...data,photo,used:{}});save();closeModal();renderRecipes();toast(photo?'Recette créée avec sa photo 📷':'Recette créée')}}
function openSettings(){document.getElementById('modal').innerHTML=`<h2>⚙️ Paramètres</h2><p>Personnalise les catégories de recettes et de courses comme tu veux.</p><h3>📖 Catégories des recettes</h3><div id="recipeCatSettings"></div><div class="actions" style="justify-content:flex-start"><button class="btn purple" onclick="addCategory('recipe')">＋ Ajouter une catégorie</button></div><h3>🛒 Catégories des courses</h3><div id="shopCatSettings"></div><div class="actions" style="justify-content:flex-start"><button class="btn purple" onclick="addCategory('shopping')">＋ Ajouter une catégorie</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="btn" onclick="requestNotifications()">🔔 Activer les notifications</button><button class="btn ghost" style="margin-left:8px" onclick="exportData()">Exporter mes données</button><div class="actions"><button class="btn ghost" onclick="closeModal()">Fermer</button></div>`;showModal();renderCategorySettings()}
function renderCategorySettings(){let r=document.getElementById('recipeCatSettings'),s=document.getElementById('shopCatSettings');if(!r||!s)return;r.innerHTML=state.recipeCategories.map((c,i)=>`<div class="shop-item" style="border:1px solid var(--line);border-radius:12px;margin:7px 0"><div class="shop-name"><b>${esc(c)}</b></div><button class="btn ghost mini" onclick="renameCategory('recipe',${i})">✏️</button><button class="btn ghost mini" onclick="deleteCategory('recipe',${i})">🗑️</button></div>`).join('');s.innerHTML=state.shoppingCategories.map((c,i)=>`<div class="shop-item" style="border:1px solid var(--line);border-radius:12px;margin:7px 0"><div class="shop-name"><b>${esc(c)}</b></div><button class="btn ghost mini" onclick="renameCategory('shopping',${i})">✏️</button><button class="btn ghost mini" onclick="deleteCategory('shopping',${i})">🗑️</button></div>`).join('')}
function addCategory(type){let name=prompt('Nom de la nouvelle catégorie :');if(!name)return;name=name.trim();if(!name)return;let arr=type==='recipe'?state.recipeCategories:state.shoppingCategories;if(arr.some(x=>x.toLowerCase()===name.toLowerCase()))return toast('Cette catégorie existe déjà');arr.push(name);save();renderAll();openSettings();toast('Catégorie ajoutée')}
function renameCategory(type,index){let arr=type==='recipe'?state.recipeCategories:state.shoppingCategories,old=arr[index];let name=prompt('Nouveau nom de la catégorie :',old);if(!name)return;name=name.trim();if(!name||name===old)return;if(arr.some((x,i)=>i!==index&&x.toLowerCase()===name.toLowerCase()))return toast('Cette catégorie existe déjà');arr[index]=name;if(type==='recipe')state.recipes.forEach(r=>{if(r.cat===old)r.cat=name});else state.shopping.forEach(x=>{if(x.cat===old)x.cat=name});if(activeCat===old)activeCat=name;if(shoppingCatFilter===old)shoppingCatFilter=name;save();renderAll();openSettings();toast('Catégorie modifiée')}
function deleteCategory(type,index){let arr=type==='recipe'?state.recipeCategories:state.shoppingCategories;if(arr.length<=1)return toast('Garde au moins une catégorie');let old=arr[index];if(!confirm(`Supprimer « ${old} » ? Les éléments seront déplacés vers « Autre » si nécessaire.`))return;arr.splice(index,1);if(type==='recipe'){state.recipes.forEach(r=>{if(r.cat===old)r.cat=arr[0]||'Plat'});if(activeCat===old)activeCat='Toutes'}else{if(!state.shoppingCategories.includes('Autre'))state.shoppingCategories.push('Autre');state.shopping.forEach(x=>{if(x.cat===old)x.cat='Autre'});if(shoppingCatFilter===old)shoppingCatFilter='all'}save();renderAll();openSettings();toast('Catégorie supprimée')}
async function requestNotifications(){if(!('Notification'in window))return toast('Notifications non disponibles ici');let p=await Notification.requestPermission();toast(p==='granted'?'Notifications activées':'Permission refusée')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ma-cuisine-donnees.json';a.click()}
function showModal(){document.getElementById('modalBack').classList.add('show')}function closeModal(){document.getElementById('modalBack').classList.remove('show');document.getElementById('modal').className='modal'}
setInterval(()=>{updateReminder();checkNotifications()},30000);let sent={};function checkNotifications(){if(!('Notification'in window)||Notification.permission!=='granted')return;let now=new Date();state.agenda.forEach(x=>{let t=new Date(x.date+'T'+(x.notifyTime||startTime(x.time,x.duration))+':00');if(Math.abs(t-now)<30000&&!sent[x.id]){new Notification('Mikadodo',{body:`${x.name} — notification prévue à ${x.notifyTime||startTime(x.time,x.duration)}. Repas à ${x.time}.`});sent[x.id]=1}})}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});renderAll();
</script>
