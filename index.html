<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#E8A7B8"/>
<link rel="manifest" href="manifest.webmanifest"/>
<title>Mikadodo</title>
<style>
:root{--green:#E8A7B8;--green2:#FCEFF3;--purple:#D889A1;--purple2:#F9E6EC;--ink:#292326;--muted:#7D7478;--line:#EEE3E7;--bg:#FFFBFC;--danger:#D86B7A;--warning:#D9A35B;--shadow:0 4px 16px rgba(105,72,84,.10)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;padding-bottom:76px}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.hero{height:145px;background:linear-gradient(135deg,#F3C7D2,#E8A7B8);display:flex;align-items:flex-end;padding:18px 18px 20px;color:#fff;position:relative}.hero h1{margin:0;font-size:30px}.hero p{margin:3px 0 0;opacity:.9}.hero .gear{position:absolute;right:18px;bottom:20px;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:45px;height:45px;font-size:22px}.tabs{display:flex;overflow:auto;background:#fff}.tab{padding:14px 18px;white-space:nowrap;color:#777;font-weight:700;border-bottom:3px solid transparent}.tab.active{color:var(--green);border-color:var(--green)}main{max-width:900px;margin:auto;padding:18px}.view{display:none}.view.active{display:block}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 14px}.section-head h2{margin:0;font-size:24px}.btn{background:var(--green);color:#fff;padding:11px 16px;border-radius:13px;font-weight:800}.btn.purple{background:var(--purple)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:14px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.chip{padding:9px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);white-space:nowrap}.chip.active{background:var(--purple);color:#fff;border-color:var(--purple)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.recipe-photo{height:125px;background:linear-gradient(135deg,#e8d2aa,#f6f0df);display:flex;align-items:center;justify-content:center;font-size:64px}.card-body{padding:14px}.card h3{margin:0 0 6px;font-size:19px}.meta{color:var(--muted);font-size:14px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--green2);color:#B65F78;font-weight:800;font-size:13px}.pill.warn{background:#fff3d8;color:#a56b00}.pill.danger{background:#ffe0e0;color:#b52e2e}.stock-group{margin:18px 0}.stock-title{display:flex;justify-content:space-between;align-items:center;background:var(--green2);padding:12px 14px;border-radius:15px 15px 0 0;font-weight:900}.stock-item{background:#fff;border-radius:15px;margin:9px 0;padding:13px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}.stock-icon{width:56px;height:56px;border-radius:14px;background:#F8E3EA;display:flex;align-items:center;justify-content:center;font-size:30px}.stock-info{flex:1}.stock-info strong{display:block;font-size:18px}.stock-info small{display:block;color:var(--muted);margin-top:3px}.price{font-weight:900}.calendar{display:grid;gap:10px}.day{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:14px}.day h3{margin:0 0 10px}.meal{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.meal:first-of-type{border-top:0}.meal .time{width:54px;font-weight:900;color:var(--purple)}.meal-info{flex:1}.meal-info strong{display:block}.meal-info small{color:var(--muted)}.shopping-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.summary{background:#fff;border-radius:15px;padding:12px;box-shadow:var(--shadow)}.summary small{display:block;color:var(--muted)}.summary strong{font-size:20px}.shop-item{display:flex;align-items:center;gap:12px;background:#fff;padding:14px;border-bottom:1px solid var(--line)}.shop-item:first-child{border-radius:15px 15px 0 0}.shop-item:last-child{border-radius:0 0 15px 15px}.check{width:25px;height:25px;border:2px solid #378de5;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:#fff}.check.on{background:#378de5}.shop-name{flex:1}.shop-name.done{text-decoration:line-through;color:#999}.shop-price{font-weight:800}.empty{background:#fff;border:1px dashed #ccc;border-radius:18px;padding:28px;text-align:center;color:var(--muted)}.fab{position:fixed;right:18px;bottom:88px;background:var(--green);color:#fff;border-radius:999px;padding:14px 20px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:15}.bottom{position:fixed;bottom:0;left:0;right:0;height:72px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30}.bottom button{flex:1;background:#fff;color:#888;font-weight:800}.bottom button.active{color:var(--green)}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal-back.show{display:flex}.modal{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.modal h2{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:999px;z-index:80;display:none}.toast.show{display:block}.notif{background:#fff4cf;border-left:5px solid var(--warning);padding:13px;border-radius:12px;margin:10px 0}.small{font-size:13px;color:var(--muted)}
@media(max-width:600px){main{padding:14px}.hero{height:125px}.hero h1{font-size:26px}.grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.shopping-summary{grid-template-columns:1fr 1fr}.shopping-summary .summary:last-child{grid-column:1/-1}.recipe-photo{height:105px}.card-body{padding:11px}.card h3{font-size:16px}.fab{bottom:84px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="hero"><div><h1>🍴 Mikadodo</h1><p>Recettes · Stock · Courses · Agenda</p></div><button class="gear" onclick="openSettings()">⚙️</button></div>
  <nav class="tabs">
    <button class="tab active" data-view="recipes">📖 Recettes</button><button class="tab" data-view="stock">🧊 Mon stock</button><button class="tab" data-view="agenda">📅 Agenda</button><button class="tab" data-view="shopping">🛒 Courses</button>
  </nav>
</header>
<main>
<section id="recipes" class="view active">
 <div class="section-head"><h2>Mes recettes</h2><button class="btn purple" onclick="openRecipeModal()">＋ Recette</button></div>
 <input id="recipeSearch" class="search" placeholder="🔍 Rechercher une recette, un ingrédient…" oninput="renderRecipes()"/>
 <div id="recipeChips" class="chips"></div><div id="recipeGrid" class="grid"></div>
</section>
<section id="stock" class="view">
 <div class="section-head"><h2>Mon stock</h2><button class="btn" onclick="openStockModal()">＋ Ajouter</button></div>
 <input id="stockSearch" class="search" placeholder="🔍 Rechercher par nom ou marque…" oninput="renderStock()"/>
 <div class="chips"><button class="chip active" onclick="stockFilter='all';renderStock()">Tout</button><button class="chip" onclick="stockFilter='Réfrigérateur';renderStock()">🧊 Réfrigérateur</button><button class="chip" onclick="stockFilter='Congélateur';renderStock()">❄️ Congélateur</button><button class="chip" onclick="stockFilter='Placard';renderStock()">🏠 Placard</button></div>
 <div id="stockList"></div>
</section>
<section id="agenda" class="view">
 <div class="section-head"><h2>Agenda des repas</h2><button class="btn" onclick="openAgendaModal()">＋ Repas</button></div>
 <div class="notif" id="nextReminder">🔔 Les rappels de préparation apparaîtront ici.</div>
 <div id="calendar" class="calendar"></div>
</section>
<section id="shopping" class="view">
 <div class="section-head"><h2>Liste de courses</h2><button class="btn" onclick="openShopModal()">＋ Article</button></div>
 <div class="shopping-summary"><div class="summary"><small>Pas acheté</small><strong id="notBought">0 €</strong></div><div class="summary"><small>Acheté</small><strong id="bought">0 €</strong></div><div class="summary"><small>Total</small><strong id="total">0 €</strong></div></div>
 <div id="shopList"></div>
</section>
</main>
<button class="fab" id="fab" onclick="quickAdd()">＋ Ajouter</button>
<nav class="bottom"><button class="active" data-view="recipes">📖<br>Recettes</button><button data-view="stock">🧊<br>Stock</button><button data-view="agenda">📅<br>Agenda</button><button data-view="shopping">🛒<br>Courses</button></nav>
</div>
<div id="modalBack" class="modal-back" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='maCuisineV1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 recipes:[
  {id:1,name:'Hachis parmentier',cat:'Plat',prep:20,cook:30,serv:4,cost:11.8,keep:3,keepUnit:'jours',keepPlace:'Réfrigérateur',emoji:'🥔',ingredients:['500 g viande hachée','1 kg pommes de terre','50 cl lait','50 g beurre','100 g fromage'],steps:['Préparer la purée.','Faire revenir la viande.','Assembler dans un plat.','Ajouter le fromage puis cuire 30 min.']},
  {id:2,name:'Couscous',cat:'Plat',prep:30,cook:60,serv:4,cost:12,keep:3,keepUnit:'jours',keepPlace:'Réfrigérateur',emoji:'🍲',ingredients:['500 g agneau ou bœuf','100 g poulet','100 ml coulis de tomate','1,2 L eau','3 patates','2 carottes','2 navets','200 g pois chiche','300 g semoule','2 c. à s. huile d’olive'],steps:['Préparer la viande et les légumes.','Faire mijoter le bouillon.','Préparer la semoule.','Servir chaud.']},
  {id:3,name:'Mousse au chocolat',cat:'Dessert',prep:20,cook:0,serv:4,cost:4.5,keep:2,keepUnit:'jours',keepPlace:'Réfrigérateur',emoji:'🍫',ingredients:['200 g chocolat','4 œufs','1 pincée de sel'],steps:['Faire fondre le chocolat.','Séparer les blancs des jaunes.','Monter les blancs en neige.','Incorporer délicatement.']}
 ],
 stock:[{id:101,name:'Muffins',place:'Congélateur',qty:1,unit:'x',date:'2026-11-01',days:null,emoji:'🧁'},{id:102,name:'Pesto',place:'Congélateur',qty:2,unit:'x',date:'2026-12-01',days:null,emoji:'🌿'},{id:103,name:'Lait',place:'Réfrigérateur',qty:2,unit:'L',date:'2026-09-14',days:null,emoji:'🥛'}],
 shopping:[{id:201,name:'Lait',qty:2,price:1.5,done:false},{id:202,name:'Tomates',qty:1,price:1,done:false},{id:203,name:'Pain',qty:1,price:1,done:false}],
 agenda:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function money(n){return (Number(n)||0).toFixed(2).replace('.',',')+' €'}function fmtDate(d){return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function switchView(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));document.getElementById('fab').style.display=v==='recipes'?'block':'none';renderAll()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
function renderAll(){renderRecipes();renderStock();renderAgenda();renderShopping();updateReminder()}
const cats=['Toutes','Petit-déjeuner','Entrée','Salade','Soupe','Plat','Accompagnement','Sandwich','Dessert','Boisson','Goûter','Apéritif'];let activeCat='Toutes',stockFilter='all';
function renderRecipes(){let q=(document.getElementById('recipeSearch')?.value||'').toLowerCase();document.getElementById('recipeChips').innerHTML=cats.map(c=>`<button class="chip ${activeCat===c?'active':''}" onclick="activeCat='${c}';renderRecipes()">${c}</button>`).join('');let a=state.recipes.filter(r=>(activeCat==='Toutes'||r.cat===activeCat)&&(!q||r.name.toLowerCase().includes(q)||r.ingredients.join(' ').toLowerCase().includes(q)));document.getElementById('recipeGrid').innerHTML=a.length?a.map(r=>`<article class="card"><div class="recipe-photo">${r.emoji||'🍽️'}</div><div class="card-body"><div class="row"><span class="pill">${esc(r.cat)}</span><span class="small">${r.prep+r.cook} min</span></div><h3>${esc(r.name)}</h3><div class="meta">👥 ${r.serv} pers. · 💰 ${money(r.cost)}</div><div class="row" style="margin-top:10px"><span class="small">🧊 ${r.keep} ${r.keepUnit} · ${esc(r.keepPlace)}</span><button class="btn purple" onclick="openRecipe(${r.id})">Ouvrir</button></div></div></article>`).join(''):'<div class="empty">Aucune recette trouvée.</div>'}
function openRecipe(id){let r=state.recipes.find(x=>x.id===id);document.getElementById('modal').innerHTML=`<h2>${r.emoji||'🍽️'} ${esc(r.name)}</h2><div class="card" style="box-shadow:none;border:1px solid var(--line)"><div class="card-body"><div class="meta">${r.cat} · 👥 ${r.serv} personnes · 💰 ${money(r.cost)}</div><p>⏱️ Préparation : <b>${r.prep} min</b><br>🔥 Cuisson : <b>${r.cook} min</b><br>⏱️ Total : <b>${r.prep+r.cook} min</b><br>🧊 Conservation : <b>${r.keep} ${r.keepUnit} au ${r.keepPlace.toLowerCase()}</b></p><h3>Ingrédients</h3><ul>${r.ingredients.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><h3>Préparation</h3><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Fermer</button><button class="btn" onclick="addRecipeToStock(${r.id})">🧊 Ajouter au stock</button><button class="btn purple" onclick="addRecipeToShopping(${r.id})">🛒 Courses</button><button class="btn" onclick="prefillAgenda(${r.id})">📅 Agenda</button></div>`;showModal()}
function addRecipeToStock(id){let r=state.recipes.find(x=>x.id===id);document.getElementById('modal').innerHTML=`<h2>🧊 Ajouter ${esc(r.name)} au stock</h2><div class="field"><label>Emplacement</label><select id="sPlace"><option>Réfrigérateur</option><option>Congélateur</option><option>Placard</option></select></div><div class="field" style="margin-top:10px"><label>Quantité / portions</label><input id="sQty" type="number" min="1" value="1"></div><p class="small">Conservation automatique : ${r.keep} ${r.keepUnit}.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveRecipeStock(${r.id})">Ajouter</button></div>`}
function saveRecipeStock(id){let r=state.recipes.find(x=>x.id===id),qty=Number(document.getElementById('sQty').value)||1,place=document.getElementById('sPlace').value;let d=new Date();d.setDate(d.getDate()+Number(r.keep||0));state.stock.push({id:Date.now(),name:r.name,place,qty,unit:'portion(s)',date:d.toISOString().slice(0,10),days:r.keep,emoji:r.emoji||'🍽️'});save();closeModal();toast('Recette ajoutée au stock');switchView('stock')}
function addRecipeToShopping(id){let r=state.recipes.find(x=>x.id===id);r.ingredients.forEach(i=>state.shopping.push({id:Date.now()+Math.random(),name:i.replace(/^\d+[.,]?\d*\s*(g|kg|ml|cl|L|c\. à s\.)?\s*/i,''),qty:1,price:0,done:false}));save();closeModal();toast('Ingrédients ajoutés aux courses');switchView('shopping')}
function prefillAgenda(id){let r=state.recipes.find(x=>x.id===id);closeModal();openAgendaModal(r)}
function renderStock(){let q=(document.getElementById('stockSearch')?.value||'').toLowerCase();let groups=['Réfrigérateur','Congélateur','Placard'];document.getElementById('stockList').innerHTML=groups.filter(g=>stockFilter==='all'||g===stockFilter).map(g=>{let a=state.stock.filter(x=>x.place===g&&x.name.toLowerCase().includes(q));if(!a.length)return '';return `<div class="stock-group"><div class="stock-title"><span>${g==='Congélateur'?'❄️':g==='Réfrigérateur'?'🧊':'🏠'} ${g}</span><span>${a.length}</span></div>${a.map(x=>{let days=daysLeft(x.date),cl=days<=1?'danger':days<=3?'warn':'';return `<div class="stock-item"><div class="stock-icon">${x.emoji||'📦'}</div><div class="stock-info"><strong>${esc(x.name)}</strong><small>DDM/DLC : ${fmtDate(x.date)} · ${x.qty}${x.unit||'x'}</small></div><span class="pill ${cl}">${days<0?'Dépassé':days===0?'Aujourd’hui':days+' jour'+(days>1?'s':'')}</span><button class="btn ghost" onclick="consumeStock(${x.id})">−</button></div>`}).join('')}</div>`}).join('')||'<div class="empty">Ton stock est vide.</div>'}
function daysLeft(s){let a=new Date();a.setHours(0,0,0,0);let b=new Date(s);b.setHours(0,0,0,0);return Math.ceil((b-a)/86400000)}
function consumeStock(id){let x=state.stock.find(s=>s.id===id);if(!x)return;x.qty=Number(x.qty)-1;if(x.qty<=0)state.stock=state.stock.filter(s=>s.id!==id);save();renderStock();toast('Stock mis à jour')}
function openStockModal(){document.getElementById('modal').innerHTML=`<h2>🧊 Ajouter au stock</h2><div class="form-grid"><div class="field"><label>Produit</label><input id="sn" placeholder="Ex. Poulet"></div><div class="field"><label>Emplacement</label><select id="sp"><option>Réfrigérateur</option><option>Congélateur</option><option>Placard</option></select></div><div class="field"><label>Quantité</label><input id="sq" type="number" min="1" value="1"></div><div class="field"><label>Unité</label><input id="su" value="x"></div><div class="field"><label>Date limite</label><input id="sd" type="date"></div><div class="field"><label>Emoji</label><input id="se" value="📦"></div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveStock()">Ajouter</button></div>`;showModal()}
function saveStock(){let name=document.getElementById('sn').value.trim();if(!name)return toast('Indique un produit');state.stock.push({id:Date.now(),name,place:document.getElementById('sp').value,qty:Number(document.getElementById('sq').value)||1,unit:document.getElementById('su').value,date:document.getElementById('sd').value||new Date().toISOString().slice(0,10),emoji:document.getElementById('se').value});save();closeModal();renderStock();toast('Produit ajouté')}
function renderAgenda(){let days=[...Array(7)].map((_,i)=>{let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+i);return d});document.getElementById('calendar').innerHTML=days.map(d=>{let key=d.toISOString().slice(0,10),items=state.agenda.filter(x=>x.date===key).sort((a,b)=>a.time.localeCompare(b.time));return `<div class="day"><h3>${d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</h3>${['Matin','Midi','Soir'].map(m=>{let x=items.find(i=>i.moment===m);return `<div class="meal"><div class="time">${m==='Matin'?'🌅':m==='Midi'?'☀️':'🌙'}<br>${x?x.time:'—'}</div><div class="meal-info">${x?`<strong>${esc(x.name)}</strong><small>${x.duration} min · début conseillé ${startTime(x.time,x.duration)}</small>`:'<span class="small">Aucun repas</span>'}</div>${x?`<button class="btn ghost" onclick="removeAgenda(${x.id})">×</button>`:''}</div>`}).join('')}</div>`}).join('')}
function startTime(t,dur){let [h,m]=t.split(':').map(Number),n=h*60+m-Number(dur||0);n=(n+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function openAgendaModal(recipe){let opts=state.recipes.map(r=>`<option value="${r.id}" ${recipe?.id===r.id?'selected':''}>${esc(r.name)}</option>`).join('');document.getElementById('modal').innerHTML=`<h2>📅 Programmer un repas</h2><div class="form-grid"><div class="field full"><label>Recette</label><select id="ar" onchange="updateAgendaDuration()">${opts}</select></div><div class="field"><label>Date</label><input id="ad" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Moment</label><select id="am"><option>Matin</option><option>Midi</option><option>Soir</option></select></div><div class="field"><label>Heure du repas</label><input id="at" type="time" value="20:00"></div><div class="field"><label>Durée totale (min)</label><input id="adu" type="number" value="${recipe?recipe.prep+recipe.cook:50}"></div></div><p class="small">L'application calculera automatiquement l'heure de début et le rappel.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveAgenda()">Programmer</button></div>`;showModal()}
function updateAgendaDuration(){let r=state.recipes.find(x=>x.id==document.getElementById('ar').value);document.getElementById('adu').value=r.prep+r.cook}
function saveAgenda(){let r=state.recipes.find(x=>x.id==document.getElementById('ar').value);state.agenda.push({id:Date.now(),name:r.name,date:document.getElementById('ad').value,moment:document.getElementById('am').value,time:document.getElementById('at').value,duration:Number(document.getElementById('adu').value)||0});save();closeModal();renderAgenda();updateReminder();toast('Repas programmé')}
function removeAgenda(id){state.agenda=state.agenda.filter(x=>x.id!==id);save();renderAgenda();updateReminder()}
function updateReminder(){let now=new Date(),future=state.agenda.map(x=>({...x,dt:new Date(x.date+'T'+startTime(x.time,x.duration)+':00')})).filter(x=>x.dt>now).sort((a,b)=>a.dt-b.dt)[0];document.getElementById('nextReminder').innerHTML=future?`🔔 <b>Prochain rappel :</b> ${esc(future.name)} à ${startTime(future.time,future.duration)} pour être prêt à ${future.time}.`:'🔔 Aucun rappel de préparation programmé.'}
function renderShopping(){let nb=0,b=0;state.shopping.forEach(x=>x.done?b+=x.qty*x.price:nb+=x.qty*x.price);document.getElementById('notBought').textContent=money(nb);document.getElementById('bought').textContent=money(b);document.getElementById('total').textContent=money(nb+b);document.getElementById('shopList').innerHTML=state.shopping.length?`<div style="background:#fff;border-radius:15px;box-shadow:var(--shadow);overflow:hidden">${state.shopping.map(x=>`<div class="shop-item"><button class="check ${x.done?'on':''}" onclick="toggleShop(${x.id})">${x.done?'✓':''}</button><div class="shop-name ${x.done?'done':''}"><b>${esc(x.name)}</b><div class="small">${x.qty} × ${money(x.price)}</div></div><div class="shop-price">${money(x.qty*x.price)}</div><button class="btn ghost" onclick="removeShop(${x.id})">×</button></div>`).join('')}</div>`:'<div class="empty">Ta liste de courses est vide.</div>'}
function toggleShop(id){let x=state.shopping.find(s=>s.id===id);x.done=!x.done;save();renderShopping()}function removeShop(id){state.shopping=state.shopping.filter(x=>x.id!==id);save();renderShopping()}
function openShopModal(){document.getElementById('modal').innerHTML=`<h2>🛒 Ajouter un article</h2><div class="form-grid"><div class="field full"><label>Produit</label><input id="qn" placeholder="Ex. Lait"></div><div class="field"><label>Quantité</label><input id="qq" type="number" min="1" value="1"></div><div class="field"><label>Prix unitaire</label><input id="qp" type="number" step="0.01" min="0" value="1"></div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveShop()">Ajouter</button></div>`;showModal()}
function saveShop(){let name=document.getElementById('qn').value.trim();if(!name)return toast('Indique un article');state.shopping.push({id:Date.now(),name,qty:Number(document.getElementById('qq').value)||1,price:Number(document.getElementById('qp').value)||0,done:false});save();closeModal();renderShopping();toast('Article ajouté')}
function quickAdd(){openRecipeModal()}
function openRecipeModal(){document.getElementById('modal').innerHTML=`<h2>📖 Nouvelle recette</h2><div class="form-grid"><div class="field full"><label>Nom</label><input id="rn"></div><div class="field"><label>Catégorie</label><select id="rc">${cats.slice(1).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Emoji</label><input id="re" value="🍽️"></div><div class="field"><label>Préparation (min)</label><input id="rp" type="number" value="20"></div><div class="field"><label>Cuisson (min)</label><input id="rcu" type="number" value="30"></div><div class="field"><label>Personnes</label><input id="rs" type="number" value="4"></div><div class="field"><label>Coût estimé (€)</label><input id="rco" type="number" step="0.01" value="0"></div><div class="field"><label>Conservation</label><input id="rk" type="number" value="3"></div><div class="field"><label>Unité</label><select id="rku"><option>jours</option><option>semaines</option></select></div><div class="field"><label>Stockage</label><select id="rkp"><option>Réfrigérateur</option><option>Congélateur</option><option>Placard</option></select></div><div class="field full"><label>Ingrédients (1 par ligne)</label><textarea id="ri" rows="5"></textarea></div><div class="field full"><label>Préparation (1 étape par ligne)</label><textarea id="rst" rows="5"></textarea></div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn purple" onclick="saveRecipe()">Créer</button></div>`;showModal()}
function saveRecipe(){let name=document.getElementById('rn').value.trim();if(!name)return toast('Indique un nom');state.recipes.push({id:Date.now(),name,cat:document.getElementById('rc').value,emoji:document.getElementById('re').value,prep:Number(document.getElementById('rp').value)||0,cook:Number(document.getElementById('rcu').value)||0,serv:Number(document.getElementById('rs').value)||1,cost:Number(document.getElementById('rco').value)||0,keep:Number(document.getElementById('rk').value)||0,keepUnit:document.getElementById('rku').value,keepPlace:document.getElementById('rkp').value,ingredients:document.getElementById('ri').value.split('\n').map(x=>x.trim()).filter(Boolean),steps:document.getElementById('rst').value.split('\n').map(x=>x.trim()).filter(Boolean)});save();closeModal();renderRecipes();toast('Recette créée')}
function openSettings(){document.getElementById('modal').innerHTML=`<h2>⚙️ Réglages</h2><p>Les données sont enregistrées localement sur cet appareil.</p><button class="btn" onclick="requestNotifications()">🔔 Activer les notifications</button><button class="btn ghost" style="margin-left:8px" onclick="exportData()">Exporter mes données</button><div class="actions"><button class="btn ghost" onclick="closeModal()">Fermer</button></div>`;showModal()}
async function requestNotifications(){if(!('Notification'in window))return toast('Notifications non disponibles ici');let p=await Notification.requestPermission();toast(p==='granted'?'Notifications activées':'Permission refusée')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ma-cuisine-donnees.json';a.click()}
function showModal(){document.getElementById('modalBack').classList.add('show')}function closeModal(){document.getElementById('modalBack').classList.remove('show')}
setInterval(()=>{updateReminder();checkNotifications()},30000);let sent={};function checkNotifications(){if(!('Notification'in window)||Notification.permission!=='granted')return;let now=new Date();state.agenda.forEach(x=>{let t=new Date(x.date+'T'+startTime(x.time,x.duration)+':00');if(Math.abs(t-now)<30000&&!sent[x.id]){new Notification('Mikadodo',{body:`${x.name} — ${x.duration} min de préparation. Repas prêt à ${x.time}.`});sent[x.id]=1}})}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});renderAll();
</script>
</body></html>
