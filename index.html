function normalizeIngredientForMatch(value){
  return String(value||'')
    .toLocaleLowerCase('fr')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[’']/g,"'")
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}

function isRecipeIngredientTitle(value){
  return String(value||'').trim().startsWith('*');
}

function recipeIngredientAvailability(recipe){
  const shopping = Array.isArray(state.shopping)?state.shopping:[];
  const availableText = shopping
    .filter(x=>x&&x.done)
    .map(x=>normalizeIngredientForMatch(x.name))
    .filter(Boolean);

  const links = Array.isArray(recipe.ingredientLinks)?recipe.ingredientLinks:[];
  let total=0, have=0, missing=0;

  (Array.isArray(recipe.ingredients)?recipe.ingredients:[]).forEach((ingredient,i)=>{
    const raw=String(ingredient||'').trim();
    if(!raw || isRecipeIngredientTitle(raw)) return;

    total++;
    const normalized=normalizeIngredientForMatch(raw);

    // Eau et sel sont considérés disponibles comme dans la vérification
    // existante de la fiche recette.
    if(/(^| )(?:eau|sel)( |$)/.test(normalized)){
      have++;
      return;
    }

    // Si l'ingrédient est lié à un article de courses, ce lien est la source
    // de vérité. On ne fait surtout pas de rapprochement textuel avec un autre
    // article : par exemple "patate douce rouge" ne doit pas être considéré
    // disponible parce que "patate douce" est dans les courses.
    const link=links[i];
    if(link?.shoppingId){
      const linkedShop=shopping.find(x=>Number(x.id)===Number(link.shoppingId));
      if(linkedShop && linkedShop.done){
        have++;
      } else {
        missing++;
      }
      return;
    }

    // Sans lien explicite, comparaison souple du texte : on ignore les
    // quantités et unités, mais TOUS les mots significatifs de l'ingrédient
    // doivent être présents dans l'article pour éviter les faux positifs.
    const ingredientWords=normalized
      .split(' ')
      .filter(w=>w.length>=3 && !/^(g|kg|ml|cl|l|mg|cuillere|cuilleres|c|a|s|cs|cc|piece|pieces|x)$/.test(w));

    const found=availableText.some(item=>{
      const itemWords=item.split(' ').filter(w=>w.length>=3);
      const useful=ingredientWords.filter(w=>!['de','du','des','le','la','les','et','ou','au','aux'].includes(w));
      if(!useful.length) return false;
      return useful.every(w=>itemWords.includes(w));
    });

    if(found) have++; else missing++;
  });

  return {total,have,missing};
}

  const candidates=breakfastDishCandidates(type)
    .filter(r=>!excludedIds.includes(r.id));

function pickUniqueBreakfastDishItems(){
  // On cherche une combinaison de 3 recettes différentes.
  // Une même recette peut avoir plusieurs types (ex. un porridge = fruit + laitage + céréales),
  // mais elle ne doit apparaître qu'une seule fois dans le plat.
  const types=['laitage','céréales','fruit'];
  const pools=types.map(type=>breakfastDishCandidates(type));

  if(pools.some(pool=>!pool.length)){
    return types.map(type=>pickBreakfastDishItem(type));
  }

  // Mélange l'ordre de recherche pour garder un peu d'aléatoire.
  pools.forEach(pool=>{
    for(let i=pool.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]]=[pool[j],pool[i]];
    }
  });

  // Backtracking : trouve une combinaison sans recette répétée,
  // même lorsqu'une recette possède plusieurs types.
  function search(index, chosen){
    if(index===types.length)return chosen;
    for(const recipe of pools[index]){
      if(chosen.some(r=>r.id===recipe.id))continue;
      const result=search(index+1,[...chosen,recipe]);
      if(result)return result;
    }
    return null;
  }

  return search(0,[]) || types.map(type=>pickBreakfastDishItem(type));
}

async function breakfastDishPhotoData(recipe){
  if(!recipe)return '';
  const refs=Array.isArray(recipe.photos)&&recipe.photos.length?recipe.photos:[recipe.photo];
  for(const ref of refs){
    const src=await getPhoto(ref);
    if(src)return src;
  }
  return '';
}

function breakfastDishEscapeText(ctx,text,x,y,maxWidth,font){
  ctx.font=font;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const words=String(text||'').split(/\s+/);
  const lines=[];
  let line='';
  for(const word of words){
    const test=line?line+' '+word:word;
    if(ctx.measureText(test).width>maxWidth && line){
      lines.push(line);
      line=word;
    }else line=test;
  }
  if(line)lines.push(line);
  lines.slice(0,3).forEach((l,i)=>ctx.fillText(l,x,y+(i-(Math.min(lines.length,3)-1)/2)*24));
}

function loadBreakfastDishImage(src){
  return new Promise(resolve=>{
    if(!src){resolve(null);return}
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>resolve(null);
    img.src=src;
  });
}

async function buildBreakfastDish(items){
  const canvas=document.createElement('canvas');
  canvas.width=1400;
  canvas.height=1000;
  const ctx=canvas.getContext('2d');

  ctx.fillStyle='#FFFBFC';
  ctx.fillRect(0,0,1400,1000);

  ctx.fillStyle='#292326';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font='900 58px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif';
  ctx.fillText('Ton petit déjeuner de ce matin',700,72);

  // Les 3 photos occupent toute la largeur, côte à côte :
  // laitage → céréales → fruit.
  const box={x:40,y:140,w:1320,h:700};
  ctx.fillStyle='#FCEFF3';
  ctx.beginPath();
  ctx.roundRect(box.x,box.y,box.w,box.h,36);
  ctx.fill();

  const images=[];
  for(const item of items){
    const src=await breakfastDishPhotoData(item);
    images.push(await loadBreakfastDishImage(src));
  }

  const labels=['🥛 Laitage','🌾 Féculents','🍎 Fruit'];
  const gap=14;
  const innerX=box.x+16;
  const innerY=box.y+16;
  const innerW=box.w-32;
  const colW=(innerW-gap*2)/3;
  const photoH=520;

  for(let i=0;i<3;i++){
    const img=images[i];
    const x=innerX+i*(colW+gap);
    const y=innerY;

    ctx.save();
    ctx.beginPath();
    ctx.roundRect(x,y,colW,photoH,24);
    ctx.clip();

    if(img){
      const scale=Math.max(colW/img.naturalWidth,photoH/img.naturalHeight);
      const iw=img.naturalWidth*scale;
      const ih=img.naturalHeight*scale;
      ctx.drawImage(img,x+(colW-iw)/2,y+(photoH-ih)/2,iw,ih);
    }else{
      ctx.fillStyle='#fff';
      ctx.fillRect(x,y,colW,photoH);
    }
    ctx.restore();

    ctx.fillStyle='#292326';
    ctx.font='900 32px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif';
    ctx.fillText(labels[i],x+colW/2,y+photoH+48);

    const name=String(items[i]?.name||'').trim();
    if(name){
      ctx.fillStyle='#7D7478';
      ctx.font='600 23px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif';
      ctx.fillText(name,x+colW/2,y+photoH+88);
    }
  }

  return canvas.toDataURL('image/png');
}

async function createBreakfastDish(){
  // Ordre fixe : laitage → céréales → fruit.
  const items=pickUniqueBreakfastDishItems();

  const missing=[];
  if(!items[0])missing.push('un laitage');
  if(!items[1])missing.push('un féculent');
  if(!items[2])missing.push('un fruit');

  const modal=document.getElementById('breakfastDishModal');
  const content=document.getElementById('breakfastDishContent');
  if(!modal||!content)return;

  modal.style.display='flex';

  if(missing.length){
    content.innerHTML=`<div class="empty">Il me faut ${esc(missing.join(', '))} dans tes recettes « Petit-déjeuner » avec les types correspondants.</div>`;
    return;
  }

  // Affiche immédiatement les 3 photos côte à côte.
  const labels=[
    ['🥛','Laitage'],
    ['🌾','Féculents'],
    ['🍎','Fruit']
  ];

  const photoSources=await Promise.all(items.map(item=>breakfastDishPhotoData(item)));
  const cards=items.map((item,i)=>{
    const src=photoSources[i];
    const name=esc(item?.name||labels[i][1]);
    return `
      <div class="breakfast-dish-preview-card">
        ${src
          ? `<img src="${src}" alt="${name}">`
          : `<div style="width:100%;aspect-ratio:.9/1;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:42px;">📷</div>`}
        <div class="breakfast-dish-preview-label" style="font-weight:400;">${labels[i][0]} ${labels[i][1]}</div>
        <div style="font-size:10px;color:#7D7478;font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
      </div>`;
  }).join('');

  content.innerHTML=`
    <div style="width:100%;box-sizing:border-box;background:#FCEFF3;border-radius:20px;padding:10px;">
      <div class="breakfast-dish-preview">${cards}</div>
    </div>
    <div class="breakfast-dish-actions" style="margin-top:14px">
      <button class="btn" onclick="createBreakfastDish()">Nouveau plat</button>
    </div>`;

  // La sauvegarde PNG est secondaire : si elle échoue, les 3 photos restent visibles.
  try{
    const image=await buildBreakfastDish(items);
    latestBreakfastDishImage=image;
    const actions=content.querySelector('.breakfast-dish-actions');
    if(actions){
      actions.insertAdjacentHTML('afterbegin',
        `<button class="btn purple" onclick="addBreakfastDishToAgenda()">📅 Ajouter à l’agenda</button>
         <a class="btn ghost" href="${image}" download="petit-dejeuner.png">Enregistrer l’image</a>`);
    }
  }catch(e){
    console.error(e);
  }
}

function renderRecipes(){
  let q=(document.getElementById('recipeSearch')?.value||'').toLowerCase();

  }).join('');

  // Les recettes Petit-déjeuner sont affichées uniquement dans leur vue dédiée.
  let a=regularRecipes.filter(r=>
    (activeCat==='Toutes'||r.cat===activeCat)&&
    (!q||r.name.toLowerCase().includes(q))
  );

  // Le bouton affiche les recettes compatibles avec la liste de courses,
  // uniquement lorsqu'il manque au maximum 4 ingrédients.
  if(cookableRecipesOnly){
    a=a.map(r=>({...r,_availability:recipeIngredientAvailability(r)}))
      .filter(r=>r._availability.missing<=4)
      .sort((x,y)=>{
        const xm=x._availability, ym=y._availability;
        if(ym.have!==xm.have)return ym.have-xm.have;
        if(xm.missing!==ym.missing)return xm.missing-ym.missing;
        // En mode « Recettes faisables », les desserts passent en dernier :
        // ils restent disponibles, mais ne sont pas prioritaires.
        const xd=x.cat==='Dessert', yd=y.cat==='Dessert';
        if(xd!==yd)return xd?1:-1;
        return String(x.name||'').localeCompare(String(y.name||''),'fr',{sensitivity:'base'});
      });
  }else{
    a=a.sort((x,y)=>{
      if(activeCat!=='Toutes')return String(x.name||'').localeCompare(String(y.name||''),'fr',{sensitivity:'base'});
      let cx=regularCategories.indexOf(x.cat),cy=regularCategories.indexOf(y.cat);
      if(cx!==cy)return (cx<0?999:cx)-(cy<0?999:cy);
      return String(x.name||'').localeCompare(String(y.name||''),'fr',{sensitivity:'base'});
    });
  }

  document.getElementById('recipeGrid').innerHTML=a.length?a.map(r=>{

    return `<article class="card recipe-card clickable" onclick="openRecipe(${r.id})"><div class="card-body"><h3>${esc(r.name)}</h3>${durationMeta(r)?`<div class="meta">${durationMeta(r)}</div>`:''}<div class="meta">${esc(r.cat)}</div><div class="meta">${r.keepPlace==='Réfrigérateur'?'🧊 Réfrigérateur':r.keepPlace==='Congélateur'?'❄️ Congélateur':'🏠 Placard'} ${r.keep||0} ${esc(r.keepUnit||((Number(r.keep)||0)===1?'jour':'jours'))}</div><div class="small">${servingMeta(r)} · 💰${recipeMoney(r.cost)}</div>${availability}</div><div class="recipe-photo">${photoSrc(r.photos?.[0])?`<img src="${photoSrc(r.photos[0])}" alt="" loading="lazy">`:''}</div></article>`;
  }).join(''):'<div class="empty">Aucune recette ne correspond aux ingrédients de ta liste de courses.</div>';

function parseIngredient(s){let m=String(s||'').trim().match(/^([\d.,]+)\s*(kg|g|mg|l|cl|ml|c\.?\s*à\s*(?:s|c)|cuill(?:ère|eres|ères|ères?)|unité[s]?|x)\b\s*(.*)$/i);if(!m)return{amount:1,unit:'x',name:keyFromIngredient(s)};let unit=m[2].toLowerCase().replace(/\s+/g,' ');return{amount:Number(m[1].replace(',','.')),unit,name:m[3].trim()}}
function formatScaledAmount(value, original){
  const decimals = String(original).replace(',','.').split('.')[1]?.length || 0;
  const rounded = Math.round(value * Math.pow(10, Math.min(decimals + 2, 4))) / Math.pow(10, Math.min(decimals + 2, 4));
  return String(rounded).replace('.',',');
}
function scaleIngredientLine(line, factor){
  const s=String(line||'');
  if(!s.trim() || s.trim().startsWith('*')) return s;
  // Les ingrédients commencent généralement par une quantité (100g, 2 patates, 1 boîte...).
  // On redimensionne uniquement cette première quantité afin de conserver le reste du texte tel quel.
  const m=s.match(/^(\s*)([0-9]+(?:[.,][0-9]+)?)(.*)$/);
  if(!m) return s;
  const amount=Number(m[2].replace(',','.'));
  if(!Number.isFinite(amount)) return s;
  return m[1]+formatScaledAmount(amount*factor,m[2])+m[3];
}
function openRecipeScaler(id){
  const r=state.recipes.find(x=>x.id===Number(id)); if(!r)return;
  const base=Number(r.serv)||1;

    <div class="field"><label>Nombre de <span id="recipeScaleUnit">${esc(label)}</span></label><div class="actions" style="justify-content:flex-start;align-items:center;gap:10px"><button type="button" class="btn ghost" onclick="changeRecipeScale(-1,${r.id})" aria-label="Diminuer">−</button><div id="recipeScaleServings" style="min-width:48px;text-align:center;font-size:20px;font-weight:700">${base}</div><button type="button" class="btn ghost" onclick="changeRecipeScale(1,${r.id})" aria-label="Augmenter">+</button></div></div>
    <div class="notif" style="margin-top:12px">Base : <b>${base} <span id="recipeScaleBaseUnit">${esc(unit==='glacons'?(base===1?'glaçon':'glaçons'):label)}</span></b></div>
    <h3 style="margin-top:16px">Ingrédients</h3>

function changeRecipeScale(delta,id){
  const r=state.recipes.find(x=>x.id===Number(id)); if(!r)return;
  const base=Number(r.serv)||1;
  const current=Math.max(1,Number(document.getElementById('recipeScaleServings')?.textContent)||base);
  const target=Math.max(1,current+Number(delta||0));
  const el=document.getElementById('recipeScaleServings');
  if(el)el.textContent=target;
  const labelEl=document.getElementById('recipeScaleUnit');
  if(labelEl && r.servUnit==='glacons') labelEl.textContent=target===1?'glaçon':'glaçons';
  previewRecipeScale(id);
}
function finishRecipeScaler(id){
  const r=state.recipes.find(x=>x.id===Number(id)); if(!r)return;
  const base=Number(r.serv)||1;
  const target=Math.max(1,Number(document.getElementById('recipeScaleServings')?.textContent)||base);
  const factor=target/base;
  r._temporaryScaledServings=target;
  r._temporaryScaledIngredients=r.ingredients.map(i=>scaleIngredientLine(i,factor));
  openRecipe(r.id);
}
function previewRecipeScale(id){

}

function syncStockExpiryAgenda(){
  const today=new Date(); today.setHours(0,0,0,0);
  let changed=false;
  for(const x of state.stock){
    if(!x?.id||!x.date)continue;
    const expiry=new Date(x.date+'T00:00:00');
    if(Number.isNaN(expiry.getTime()))continue;
    expiry.setHours(0,0,0,0);
    const days=Math.ceil((expiry-today)/86400000);
    if(days>=0&&days<=1){
      const exists=state.agenda.some(a=>a.type==='stock-expiry'&&Number(a.stockId)===Number(x.id)&&a.date===x.date);
      if(!exists){
        state.agenda.push({
          id:Date.now()+Math.random(),
          type:'stock-expiry',
          stockId:x.id,
          recipeId:null,
          name:`‼️ ${x.name} — à consommer`,
          date:x.date,
          moment:'Midi',
          time:'12:00',
          duration:0,
          advisedTime:'12:00',
          notifyTime:'12:00',
          photo:x.photo||''
        });
        changed=true;
      }
    }
  }
  if(changed)save();
  return changed;
}

async function saveStock(shopId,editId){
  const name=document.getElementById('sn')?.value.trim();
  if(!name){toast('Indique un produit ou un ingrédient');document.getElementById('sn')?.focus();return}
  const qty=Number(document.getElementById('sq')?.value);
  if(!(qty>0)){toast('Indique une quantité valide');document.getElementById('sq')?.focus();return}
  const keep=Number(document.getElementById('sk')?.value)||0, keepUnit=document.getElementById('sku')?.value||'jours';

}
function localDateKey(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function normalizeTime(t,fallback='00:00'){let s=String(t??'').trim();let m=s.match(/^(\d{1,2}):(\d{2})$/);if(!m)return fallback;let h=Number(m[1]),min=Number(m[2]);if(h<0||h>23||min<0||min>59)return fallback;return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`}
function momentEmoji(moment){return moment==='Matin'?'🌅':moment==='Midi'?'🌞':'🌃'}
function momentDefaultTime(moment){return moment==='Matin'?'09:00':moment==='Midi'?'12:00':'20:00'}
function cleanupPastAgenda(){
  const today=localDateKey(new Date());
  const past=state.agenda.filter(x=>x.date&&x.date<today);
  if(!past.length)return false;

  // Dès qu'une journée est passée, les repas de l'agenda sont
  // automatiquement déplacés dans l'historique comme consommés.
  state.mealHistory=Array.isArray(state.mealHistory)?state.mealHistory:[];
  for(const x of past){
    const already=state.mealHistory.some(h=>Number(h.agendaId)===Number(x.id));
    if(already)continue;
    if(!x.stockConsumed) consumeOneStockByName(x.name);
    state.mealHistory.unshift({
      id:Date.now()+Math.floor(Math.random()*1000),
      recipeId:x.recipeId||null,
      name:x.name,
      date:x.date,
      time:normalizeTime(x.time),
      moment:x.moment||'',
      agendaId:x.id,
      consumed:true
    });
  }
  state.agenda=state.agenda.filter(x=>!(x.date&&x.date<today));
  save();
  return true;
}

function saveAgenda(){let r=state.recipes.find(x=>x.id==document.getElementById('ar').value);let time=normalizeTime(document.getElementById('at').value),duration=Number(document.getElementById('adu').value)||0,advisedTime=normalizeTime(document.getElementById('ast').value,startTime(time,duration));state.agenda.push({id:Date.now(),recipeId:r.id,name:r.name,date:document.getElementById('ad').value,moment:document.getElementById('am').value,time,duration,advisedTime,notifyTime:advisedTime,photo:(r.photos?.[0]||r.photo||'')});save();closeModal();renderAgenda();updateReminder();toast('Repas programmé')}
async function openAgendaEdit(id){let x=state.agenda.find(a=>a.id===id);if(!x)return;let selectedRecipe=state.recipes.find(r=>r.id===x.recipeId)||state.recipes.find(r=>r.name===x.name);let recipeImageRef=selectedRecipe?.photos?.[0]||selectedRecipe?.photo||selectedRecipe?.image||x.photo||'';let recipeImage=await getPhoto(recipeImageRef);let opts=state.recipes.map(r=>`<option value="${r.id}" ${x.recipeId===r.id||x.name===r.name?'selected':''}>${esc(r.name)}</option>`).join('');let advised=normalizeTime(x.advisedTime||x.notifyTime||startTime(x.time,x.duration));document.getElementById('modal').className='modal agenda-edit-modal';document.getElementById('modal').innerHTML=`<button class="modal-close-x" onclick="closeModal()" aria-label="Annuler" title="Annuler">×</button><h2>✏️ Modifier le repas</h2>${recipeImage ? `<img src="${recipeImage}" alt="${selectedRecipe?.name || x.name || 'Recette'}" class="agenda-recipe-image">` : ''}<div class="form-grid"><div class="field full"><label>Recette</label><select id="ar" onchange="updateAgendaDuration()">${opts}</select></div><div class="field"><label>Date</label><input id="ad" type="date" value="${x.date}"></div><div class="field"><label>Moment</label><select id="am" onchange="syncMomentTime()"><option ${x.moment==='Matin'?'selected':''}>Matin</option><option ${x.moment==='Midi'?'selected':''}>Midi</option><option ${x.moment==='Soir'?'selected':''}>Soir</option></select></div><div class="field"><label>Heure du repas</label><input id="at" type="time" value="${x.time}" onchange="syncAgendaAdvice()"></div><div class="field"><label>Heure conseillée 🔔 notification</label><input id="ast" type="time" value="${advised}" onchange="syncNotificationToAdvice()"></div><div class="field"><label>Temps de préparation (min)</label><input id="adu" type="number" value="${x.duration}" onchange="syncAgendaAdvice()"></div></div><p class="small">L’heure conseillée est calculée automatiquement, mais tu peux la modifier manuellement.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn ghost" onclick="returnAgendaToStock(${x.id})">↩️ Remettre au stock</button><button class="btn danger" style="background:var(--danger)" onclick="removeAgenda(${x.id})">Supprimer</button><button class="btn" onclick="saveAgendaEdit(${x.id})">Enregistrer</button></div>`;showModal()}
function saveAgendaEdit(id){let x=state.agenda.find(a=>a.id===id);if(!x)return;let r=state.recipes.find(r=>r.id==document.getElementById('ar').value);if(!r)return;x.recipeId=r.id;x.name=r.name;x.date=document.getElementById('ad').value;x.moment=document.getElementById('am').value;x.time=normalizeTime(document.getElementById('at').value,x.time);x.duration=Number(document.getElementById('adu').value)||0;x.advisedTime=normalizeTime(document.getElementById('ast').value,startTime(x.time,x.duration));x.notifyTime=x.advisedTime;x.photo=(r.photos?.[0]||r.photo||'');save();closeModal();renderAgenda();updateReminder();toast('Repas modifié ✨')}
function moveAgenda(id){let x=state.agenda.find(a=>a.id===id);if(!x)return;let date=prompt('Nouvelle date (AAAA-MM-JJ) :',x.date);if(!date)return;let time=prompt('Nouvelle heure (HH:MM) :',x.time);if(!time)return;time=normalizeTime(time,x.time);x.date=date;x.time=time;x.advisedTime=prompt('Heure conseillée (HH:MM) :',x.advisedTime||startTime(time,x.duration))||x.advisedTime||startTime(time,x.duration);x.notifyTime=x.advisedTime;save();renderAgenda();updateReminder();toast('Repas déplacé ↔️')}
function consumeOneStockByName(name){name=String(name||'').replace(/^‼️\s*/,'').replace(/\s*— à consommer$/,'').trim();if(!name)return null;let matches=state.stock.filter(s=>sameFood(String(s.name||''),name)&&Number(s.qty)>0);if(!matches.length)return null;matches.sort((a,b)=>String(a.date||'9999-12-31').localeCompare(String(b.date||'9999-12-31')));let x=matches[0];x.qty=Number(x.qty)-1;if(x.qty<=0){state.stock=state.stock.filter(s=>s!==x);state.agenda=state.agenda.filter(a=>Number(a.stockId)!==Number(x.id));}return x}
function consumeAgendaMeal(id){let x=state.agenda.find(a=>a.id===id);if(!x)return;let now=new Date();let record={id:Date.now(),recipeId:x.recipeId||null,name:x.name,date:localDateKey(now),time:now.toTimeString().slice(0,5),moment:x.moment||'',agendaId:x.id,consumed:true};state.mealHistory=state.mealHistory||[];state.mealHistory.unshift(record);let consumed=x.stockConsumed?x:consumeOneStockByName(x.name);/* Le repas programmé est toujours retiré de l’agenda. Une seule portion est consommée au total. Si elle a déjà été déplacée depuis le stock, on ne la retire pas une seconde fois. */state.agenda=state.agenda.filter(a=>a.id!==id);save();renderStock();renderAgenda();updateReminder();toast(consumed?'Recette ajoutée à l’historique 🍽️ · 1 portion retirée du stock':'Recette ajoutée à l’historique 🍽️')}
function returnAgendaToStock(id){
  let x=state.agenda.find(a=>a.id===id);
  if(!x)return;
  let existing=x.stockId?state.stock.find(s=>Number(s.id)===Number(x.stockId)):null;
  if(existing){
    existing.qty=Number(existing.qty||0)+1;
  }else{
    let r=state.recipes.find(r=>r.id===x.recipeId||sameFood(String(r.name||''),String(x.name||'')));
    let d=new Date();
    if(r)addKeepToDate(d,r.keep,r.keepUnit);
    state.stock.push({
      id:Date.now(),
      name:x.name,
      place:r?.keepPlace||'Réfrigérateur',
      qty:1,
      unit:(r?.servUnit==='sandwichs'?'sandwich(s)':r?.servUnit==='pots'?'pot(s)':r?.servUnit==='bouteilles'?'bouteille(s)':r?.servUnit==='gateaux'?'gâteau(x)':'portion(s)'),
      date:d.toISOString().slice(0,10),
      days:r?.keep||0,
      keep:r?.keep||0,
      keepUnit:r?.keepUnit||'jours',
      keepPlace:r?.keepPlace||'Réfrigérateur',
      emoji:r?.emoji||'🍽️',
      photo:x.photo||r?.photos?.[0]||r?.photo||''
    });
  }
  state.agenda=state.agenda.filter(a=>a.id!==id);
  save();closeModal();renderStock();renderAgenda();updateReminder();toast('1 portion remise au stock 🧊');
}
function removeAgenda(id){let x=state.agenda.find(a=>a.id===id);if(!x)return;if(!confirm(`Supprimer le repas « ${x.name} » de l’agenda ?`))return;/* Supprimer le plan retire uniquement ce repas de l’agenda et consomme au maximum 1 portion du stock. Si une portion avait déjà été déplacée vers l’agenda, elle est déjà déduite. */let consumed=x.stockConsumed?x:consumeOneStockByName(x.name);state.agenda=state.agenda.filter(a=>a.id!==id);save();renderStock();renderAgenda();updateReminder();toast(consumed?'Repas supprimé · 1 portion retirée du stock':'Repas supprimé')}
function openStockToCalendar(stockId){let x=state.stock.find(s=>s.id===Number(stockId));if(!x||Number(x.qty)<=0){toast('Stock insuffisant');return}let defaultTime=momentDefaultTime('Soir');let recipe=state.recipes.find(r=>sameFood(String(r.name||''),String(x.name||'')));let duration=recipe?((Number(recipe.prep)||0)+(Number(recipe.cook)||0)):0;let defaultAdvised=startTime(defaultTime,duration);document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML=`<h2>📅 Ajouter au calendrier</h2><p><strong>${esc(x.name)}</strong> · 1 ${stockUnitLabel(1,x.unit||'x')}</p><div class="form-grid"><div class="field"><label>Date</label><input id="sad" type="date" value="${localDateKey(new Date())}"></div><div class="field"><label>Moment</label><select id="sam"><option>Matin</option><option>Midi</option><option selected>Soir</option></select></div><div class="field"><label>Heure du repas</label><input id="sat" type="time" value="${defaultTime}"></div><div class="field"><label>Heure conseillée 🔔</label><input id="sast" type="time" value="${defaultAdvised}"></div></div><p class="small">Une seule portion sera déplacée du stock vers ce repas du calendrier.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveStockToCalendar(${x.id})">Ajouter au calendrier</button></div>`;showModal()}
function saveStockToCalendar(stockId){let x=state.stock.find(s=>s.id===Number(stockId));if(!x||Number(x.qty)<=0){toast('Stock insuffisant');closeModal();return}let time=normalizeTime(document.getElementById('sat')?.value,momentDefaultTime(document.getElementById('sam')?.value||'Soir'));let moment=document.getElementById('sam')?.value||'Soir';let recipe=state.recipes.find(r=>sameFood(String(r.name||''),String(x.name||'')));let duration=recipe?((Number(recipe.prep)||0)+(Number(recipe.cook)||0)):0;let advisedTime=normalizeTime(document.getElementById('sast')?.value,startTime(time,duration));let agendaItem={id:Date.now(),recipeId:recipe?.id||null,name:x.name,date:document.getElementById('sad')?.value||localDateKey(new Date()),moment,time,duration,advisedTime,notifyTime:advisedTime,photo:x.photo||recipe?.photos?.[0]||recipe?.photo||'',stockConsumed:true,stockId:x.id};x.qty=Number(x.qty)-1;if(x.qty<=0){state.stock=state.stock.filter(s=>s!==x)}state.agenda.push(agendaItem);save();closeModal();renderStock();renderAgenda();updateReminder();toast('1 portion ajoutée au calendrier 📅')}
function updateReminder(){let now=new Date(),future=state.agenda.map(x=>({...x,dt:new Date(x.date+'T'+(x.notifyTime||startTime(x.time,x.duration))+':00')})).filter(x=>x.dt>now).sort((a,b)=>a.dt-b.dt)[0];document.getElementById('nextReminder').innerHTML=future?`🔔 <b>Prochain rappel :</b> ${esc(future.name)} — 🔔 ${esc(normalizeTime(future.notifyTime||startTime(future.time,future.duration)))} · repas à ${esc(normalizeTime(future.time))}.`:'🔔 Aucun rappel programmé.'}

function shopMoney(n){let v=Number(n)||0;return Number.isInteger(v)?v+' €':v.toFixed(2).replace('.',',').replace(/,00$/,'')+' €'}function renderShopping(){let q=String(shoppingSearch||'').trim().toLocaleLowerCase('fr');let catsToShow=shoppingCatFilter==='all'?state.shoppingCategories:[shoppingCatFilter];let html=state.shopping.length?catsToShow.map(cat=>{let items=state.shopping.filter(x=>(x.cat||'Autre')===cat&&(shoppingIngredientFilter==='toBuy'?!x.done:shoppingIngredientFilter==='bought'?x.done:true)&&(!shoppingRecipeFilterIds.length||shoppingRecipeFilterIds.includes(Number(x.id)))&&(!q||String(x.name||'').toLocaleLowerCase('fr').includes(q))).sort((a,b)=>(a.done-b.done)||String(a.name||'').localeCompare(String(b.name||''),'fr',{sensitivity:'base'}));if(!items.length)return '';let notBought=items.filter(x=>!x.done).reduce((sum,x)=>sum+(Number(x.qty)||0)*(Number(x.price)||0),0);let bought=items.filter(x=>x.done).reduce((sum,x)=>sum+(Number(x.qty)||0)*(Number(x.price)||0),0);let catTotal=notBought+bought;return `<div class="stock-group"><div class="shopping-category-title"><span>🛒 ${esc(cat)}</span><span class="category-title-total">${shopMoney(catTotal)}</span></div><div class="category-stats"><span>Pas acheté <strong>${shopMoney(notBought)}</strong></span><span>Acheté <strong>${shopMoney(bought)}</strong></span><span>Total <strong>${shopMoney(catTotal)}</strong></span></div><div style="background:#fff;border-radius:0 0 15px 15px;box-shadow:var(--shadow);overflow:hidden">${items.map(x=>`<div class="shop-item shopping-item-compact clickable" data-shop-id="${x.id}" onclick="openShopEdit(${x.id})"><button class="check ${x.done?'on':''}" onclick="event.stopPropagation();toggleShop(${x.id})">${x.done?'✓':''}</button><div class="shop-name ${x.done?'done':''}"><b>${esc(x.name)}</b><div class="small">${x.qty} × ${shopMoney(x.price)}</div></div><span class="shop-price">${shopMoney(x.price)}</span></div>`).join('')}</div></div>`}).join(''):(q?'<div class="empty">Aucun article ne correspond à ta recherche.</div>':'<div class="empty">Ta liste de courses est vide.</div>');document.getElementById('shopList').innerHTML=`<input id="shoppingSearch" class="search" type="search" value="${esc(shoppingSearch)}" placeholder="🔎 Rechercher un article..." oninput="setShoppingSearch(this.value)"><div class="chips" style="margin-bottom:10px"><button class="chip ${shoppingCatFilter==='all'?'active':''}" onclick="shoppingCatFilter='all';renderShopping()">Toutes</button>${state.shoppingCategories.map(c=>`<button class="chip ${shoppingCatFilter===c?'active':''}" onclick="setShoppingCategory('${encodeURIComponent(c)}')">${esc(c)}</button>`).join('')}</div>${html}`;updateShoppingIngredientFilterButton();

function isAlwaysAvailableIngredient(text){let lower=String(text||'').trim().toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');return /(^|[^a-zàâäéèêëîïôöùûüÿç])(eau|sel|huile d[’']olive|huile d olive|rhum)(?=[^a-zàâäéèêëîïôöùûüÿç]|$)/i.test(lower)}
function isWaterIngredient(text){return isAlwaysAvailableIngredient(text)}
function renderRecipeIngredientLinks(){let el=document.getElementById('recipeIngredientLinks');let ta=document.getElementById('ri');if(!el||!ta)return;let r=state.recipes.find(x=>x.id===window.editingRecipeId);let baseLinks=r?.ingredientLinks||(window.editingRecipeId===null?(window.pendingRecipeIngredientLinks||[]):[]);let lines=ta.value.split('\n').map(x=>x.trim());let draft=window.recipeIngredientDraft;if(!draft||draft.recipeId!==window.editingRecipeId){draft={recipeId:window.editingRecipeId,raw:ta.value,rows:lines.map((text,i)=>({text,link:baseLinks[i]||{}}))};window.recipeIngredientDraft=draft}else if(draft.raw!==ta.value){let oldRows=draft.rows||[];let used=new Set();draft.rows=lines.map((text,i)=>{let match=-1;/* Le lien reste attaché à la ligne : modifier le texte de l'ingrédient ne supprime pas son association. */if(oldRows[i]&&!used.has(i)){match=i}/* Si une ligne a été supprimée/déplacée, on tente ensuite de la retrouver par son ancien texte. */if(match<0){for(let j=0;j<oldRows.length;j++){if(!used.has(j)&&oldRows[j].text===text){match=j;break}}}if(match>=0){used.add(match);return {text,link:oldRows[match].link||{}}}return {text,link:{}}});draft.raw=ta.value}el.innerHTML=lines.map((line,i)=>{let link=draft.rows[i]?.link||{};if(!line)return '';if(line.startsWith('*'))return `<div class="recipe-link-title"><div class="small">${esc(line.replace(/^\*\s*/,''))}</div></div>`;if(isAlwaysAvailableIngredient(line))return `<div class="recipe-link-compact" data-ingredient-row="${i}"><div class="small">${esc(line)}</div><div class="small" style="font-weight:700">🟢 Disponible</div><input type="hidden" class="recipe-link-shop" data-index="${i}" value=""><input class="recipe-link-qty" data-index="${i}" type="hidden" value="0"><input class="recipe-link-unit" data-index="${i}" type="hidden" value="ml"></div>`;let selected=state.shopping.find(x=>Number(x.id)===Number(link.shoppingId));let label=selected?.name||'— Aucun lien —';let opts='<option value="">— Aucun lien —</option>'+state.shopping.map(x=>`<option value="${x.id}" ${Number(link.shoppingId)===Number(x.id)?'selected':''}>${esc(x.name)}</option>`).join('');return `<div class="recipe-link-compact" data-ingredient-row="${i}"><div class="small">${esc(line)}</div><div><button type="button" class="recipe-link-shop-picker" onclick="openRecipeIngredientPicker(${i})">${esc(label)}</button><select class="recipe-link-shop" data-index="${i}" aria-label="Article de courses" style="display:none">${opts}</select></div><input class="recipe-link-qty" data-index="${i}" type="number" min="0" step="0.01" value="${link.qty??1}" aria-label="Quantité utilisée"><select class="recipe-link-unit" data-index="${i}" aria-label="Unité"><option value="pieces" ${(link.unit||'pieces')==='pieces'?'selected':''}>Pièces</option><option value="g" ${link.unit==='g'?'selected':''}>Grammes</option><option value="ml" ${link.unit==='ml'?'selected':''}>Millilitres</option></select></div>`}).join('')||'';}

function openRecipeIngredientPicker(index){let row=document.querySelector(`#recipeIngredientLinks [data-ingredient-row="${index}"]`);let select=row?.querySelector('.recipe-link-shop');if(!row||!select)return;let existing=document.getElementById('recipeIngredientPicker');if(existing)existing.remove();let back=document.createElement('div');back.id='recipeIngredientPicker';back.className='recipe-picker-back show';back.innerHTML=`<div class="recipe-picker" role="dialog" aria-modal="true"><div class="recipe-picker-head"><span>🛒 Choisir un ingrédient</span><button type="button" class="btn ghost" style="padding:7px 10px" onclick="closeRecipeIngredientPicker()">✕</button></div><div id="recipePickerList" class="recipe-picker-list"></div></div>`;document.body.appendChild(back);back.addEventListener('click',e=>{if(e.target===back)closeRecipeIngredientPicker()});window.recipePickerIndex=index;window.recipePickerSelect=select;window.recipePickerCategory=null;renderRecipeIngredientPickerList();}
function renderRecipeIngredientPickerList(){
  const list=document.getElementById('recipePickerList');
  if(!list)return;
  const selected=window.recipePickerSelect?.value||'';
  const categories=[...new Set(state.shopping.map(x=>x.cat||'Autre'))];
  if(!window.recipePickerCategory){
    list.innerHTML=`<button type="button" class="recipe-picker-item" data-recipe-no-link>— Aucun lien —</button>`+
      categories.map(cat=>`<button type="button" class="recipe-picker-item recipe-picker-category" data-recipe-category="${esc(String(cat))}">📁 ${esc(cat)} <span>›</span></button>`).join('');
  }else{
    const cat=String(window.recipePickerCategory);
    const items=state.shopping.filter(x=>String(x.cat||'Autre')===cat).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'fr',{sensitivity:'base'}));
    list.innerHTML=`<button type="button" class="recipe-picker-back-btn" data-recipe-picker-back>‹ Retour aux catégories</button>`+
      items.map(x=>`<button type="button" class="recipe-picker-item" data-recipe-item="${esc(String(x.id))}">${esc(x.name)}${String(x.id)===String(selected)?' ✓':''}</button>`).join('')+
      (items.length?'':'<div class="recipe-picker-none">Aucun ingrédient dans cette catégorie.</div>');
  }
  // Utiliser des écouteurs directs : cela évite les problèmes de clic sur les boutons
  // générés dynamiquement et garantit l'ouverture du contenu de la catégorie.
  list.querySelector('[data-recipe-no-link]')?.addEventListener('click',()=>chooseRecipeIngredient(''));
  list.querySelector('[data-recipe-picker-back]')?.addEventListener('click',()=>{window.recipePickerCategory=null;renderRecipeIngredientPickerList();});
  list.querySelectorAll('[data-recipe-category]').forEach(btn=>btn.addEventListener('click',()=>openRecipeIngredientCategory(btn.dataset.recipeCategory)));
  list.querySelectorAll('[data-recipe-item]').forEach(btn=>btn.addEventListener('click',()=>chooseRecipeIngredient(btn.dataset.recipeItem)));
}
function openRecipeIngredientCategory(category){window.recipePickerCategory=category;renderRecipeIngredientPickerList();}
function chooseRecipeIngredient(id){
  const select=window.recipePickerSelect;
  if(!select)return;
  const value=String(id??'');
  const index=Number(select.dataset.index);
  const row=select.closest('.recipe-link-compact');
  const item=state.shopping.find(x=>String(x.id)===value);
  const q=row?.querySelector('.recipe-link-qty');
  const u=row?.querySelector('.recipe-link-unit');
  const link=item?{shoppingId:item.id,qty:Number(q?.value)||0,unit:u?.value||'pieces'}:null;

  // En mode modification, on enregistre immédiatement le lien dans la recette.
  const recipe=state.recipes.find(x=>String(x.id)===String(window.editingRecipeId));
  if(recipe){
    recipe.ingredientLinks=Array.isArray(recipe.ingredientLinks)?recipe.ingredientLinks:[];
    if(link) recipe.ingredientLinks[index]=link;
    else delete recipe.ingredientLinks[index];
    if(window.recipeIngredientDraft?.rows?.[index]) window.recipeIngredientDraft.rows[index].link=link||{};
    save();
  }else{
    // Pour une nouvelle recette, conserver le choix jusqu'à la création.
    window.pendingRecipeIngredientLinks=window.pendingRecipeIngredientLinks||[];
    if(link) window.pendingRecipeIngredientLinks[index]=link;
    else delete window.pendingRecipeIngredientLinks[index];
    if(window.recipeIngredientDraft?.rows?.[index]) window.recipeIngredientDraft.rows[index].link=link||{};
  }

  if(select)select.value=value;
  const btn=row?.querySelector('.recipe-link-shop-picker');
  if(btn){btn.textContent=item?.name||'— Aucun lien —';btn.classList.toggle('linked',!!item);}
  closeRecipeIngredientPicker();
  // Re-rendre la ligne depuis les données enregistrées pour que le choix reste visible.
  if(row?.parentElement)renderRecipeIngredientLinks();
  toast(item?`« ${item.name} » lié à la liste de courses ✓`:'Lien supprimé');
}
function closeRecipeIngredientPicker(){document.getElementById('recipeIngredientPicker')?.remove();window.recipePickerIndex=null;window.recipePickerSelect=null;}

function collectRecipeIngredientLinks(){let links=[];document.querySelectorAll('.recipe-link-shop').forEach(sel=>{let i=Number(sel.dataset.index),id=Number(sel.value);if(!id)return;let q=document.querySelector(`.recipe-link-qty[data-index=\"${i}\"]`),u=document.querySelector(`.recipe-link-unit[data-index=\"${i}\"]`);links[i]={shoppingId:id,qty:Number(q?.value)||0,unit:u?.value||'pieces'} });return links}
function previewRecipeImage(e){previewRecipeImages(e)}
function previewRecipeImages(e){let wrap=document.getElementById('rphotoPreviewWrap');if(!wrap)return;let files=Array.from(e.target.files||[]).slice(0,2);if(e.target.files?.length>2)toast('2 photos maximum');wrap.innerHTML=files.map(f=>`<img class="photo-preview-inline" src="${URL.createObjectURL(f)}" alt="Aperçu">`).join('')}
function resizeRecipeImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let max=1000,w=im.width,h=im.height;if(Math.max(w,h)>max){if(w>=h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',0.78))};im.onerror=reject;im.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
async function saveRecipe(editId){let name=document.getElementById('rn').value.trim();if(!name)return toast('Indique un nom');let files=Array.from(document.getElementById('rphoto')?.files||[]).slice(0,2),photos=[];try{for(const file of files){const data=await resizeRecipeImage(file);photos.push(await putPhoto(data))}}catch(e){console.error(e);return toast('Impossible d’enregistrer cette photo')}let old=editId?state.recipes.find(x=>x.id===editId):null;let oldPhotos=old?(Array.isArray(old.photos)?old.photos:(old.photo?[old.photo]:[])):[];let data={name,cat:document.getElementById('rc').value,emoji:'',prep:Number(document.getElementById('rp').value)||0,cook:Number(document.getElementById('rcu').value)||0,serv:Number(document.getElementById('rs').value)||1,servUnit:document.getElementById('rsu').value||'personnes',cost:Number(document.getElementById('rco').value)||0,keep:Number(document.getElementById('rk').value)||0,keepUnit:document.getElementById('rku').value,keepPlace:document.getElementById('rkp').value,types:collectBreakfastTypes(),breakfastCategory:document.getElementById('rc').value==='Petit-déjeuner'?(document.getElementById('rbc')?.value||''):'',ingredients:document.getElementById('ri').value.split('\n').map(x=>x.trim()),ingredientLinks:(window.recipeIngredientDraft?.rows?.map(row=>row?.link||{}) || collectRecipeIngredientLinks()),steps:document.getElementById('rst').value.split('\n').map(x=>x.trim())};if(editId){let r=old;if(!r)return;Object.assign(r,data);if(files.length){r.photos=photos;r.photo=photos[0]||''}else{r.photos=oldPhotos;r.photo=oldPhotos[0]||''}save();closeModal();renderRecipes();toast('Recette modifiée ✨');openRecipe(editId)}else{state.recipes.push({id:Date.now(),...data,photos,photo:photos[0]||'',used:{}});window.pendingRecipeIngredientLinks=[];save();closeModal();renderRecipes();toast(photos.length?'Recette créée avec ses photos 📷':'Recette créée')}}

function openSettings(){document.getElementById('modal').innerHTML=`<h2>⚙️ Paramètres</h2><h3 style="margin:10px 0 6px">🍽️ Historique des repas</h3><div id="mealHistorySettings"></div><h3 style="margin:10px 0 6px">📖 Catégories des recettes</h3><div id="recipeCatSettings"></div><div class="actions" style="justify-content:flex-start;margin:6px 0"><button class="btn purple" onclick="addCategory('recipe')">＋ Ajouter</button></div><h3 style="margin:10px 0 6px">🛒 Catégories des courses</h3><div id="shopCatSettings"></div><div class="actions" style="justify-content:flex-start;margin:6px 0"><button class="btn purple" onclick="addCategory('shopping')">＋ Ajouter</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="btn" onclick="requestNotifications()">🔔 Activer les notifications</button><button class="btn ghost" style="margin:8px 8px 0 0" onclick="exportData()">Exporter toutes mes données</button><button class="btn ghost" style="margin-top:8px" onclick="document.getElementById('importDataInput').click()">Importer mes données</button><input id="importDataInput" type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"><div class="small" style="margin-top:8px">La sauvegarde inclut aussi les photos des recettes, du stock et de l’agenda.</div><div class="actions"><button class="btn ghost" onclick="closeModal()">Fermer</button></div>`;showModal();renderCategorySettings();renderMealHistorySettings()}
function renderCategorySettings(){let r=document.getElementById('recipeCatSettings'),s=document.getElementById('shopCatSettings');if(!r||!s)return;r.innerHTML=state.recipeCategories.map((c,i)=>`<div class="shop-item" style="border:1px solid var(--line);border-radius:9px;margin:3px 0;padding:5px 7px;min-height:34px"><div class="shop-name" style="font-weight:400">${esc(c)}</div><button class="btn ghost mini" style="padding:4px 7px" onclick="renameCategory('recipe',${i})">✏️</button><button class="btn ghost mini" style="padding:4px 7px" onclick="deleteCategory('recipe',${i})">🗑️</button></div>`).join('');s.innerHTML=state.shoppingCategories.map((c,i)=>`<div class="shop-item" style="border:1px solid var(--line);border-radius:9px;margin:3px 0;padding:5px 7px;min-height:34px"><div class="shop-name" style="font-weight:400">${esc(c)}</div><button class="btn ghost mini" style="padding:4px 7px" onclick="renameCategory('shopping',${i})">✏️</button><button class="btn ghost mini" style="padding:4px 7px" onclick="deleteCategory('shopping',${i})">🗑️</button></div>`).join('')}
function addCategory(type){let name=prompt('Nom de la nouvelle catégorie :');if(!name)return;name=name.trim();if(!name)return;let arr=type==='recipe'?state.recipeCategories:state.shoppingCategories;if(arr.some(x=>x.toLowerCase()===name.toLowerCase()))return toast('Cette catégorie existe déjà');arr.push(name);save();renderAll();openSettings();toast('Catégorie ajoutée')}
function renameCategory(type,index){let arr=type==='recipe'?state.recipeCategories:state.shoppingCategories,old=arr[index];let name=prompt('Nouveau nom de la catégorie :',old);if(!name)return;name=name.trim();if(!name||name===old)return;if(arr.some((x,i)=>i!==index&&x.toLowerCase()===name.toLowerCase()))return toast('Cette catégorie existe déjà');arr[index]=name;if(type==='recipe')state.recipes.forEach(r=>{if(r.cat===old)r.cat=name});else state.shopping.forEach(x=>{if(x.cat===old)x.cat=name});if(activeCat===old)activeCat=name;if(shoppingCatFilter===old)shoppingCatFilter=name;save();renderAll();openSettings();toast('Catégorie modifiée')}
function deleteCategory(type,index){let arr=type==='recipe'?state.recipeCategories:state.shoppingCategories;if(arr.length<=1)return toast('Garde au moins une catégorie');let old=arr[index];if(!confirm(`Supprimer « ${old} » ? Les éléments seront déplacés vers « Autre » si nécessaire.`))return;arr.splice(index,1);if(type==='recipe'){state.recipes.forEach(r=>{if(r.cat===old)r.cat=arr[0]||'Plat'});if(activeCat===old)activeCat='Toutes'}else{if(!state.shoppingCategories.includes('Autre'))state.shoppingCategories.push('Autre');state.shopping.forEach(x=>{if(x.cat===old)x.cat='Autre'});if(shoppingCatFilter===old)shoppingCatFilter='all'}save();renderAll();openSettings();toast('Catégorie supprimée')}
async function requestNotifications(){
 if(!('Notification' in window)) return toast('Notifications non disponibles sur cet appareil');
 if(!window.isSecureContext && location.hostname!=='localhost' && location.hostname!=='127.0.0.1') return showNotificationHelp('Mikadodo doit être ouvert depuis une connexion sécurisée (HTTPS) ou installé comme application.');
 if(Notification.permission==='granted'){
   try{if('serviceWorker' in navigator){let reg=await navigator.serviceWorker.ready;await reg.showNotification('Mikadodo',{body:'Les notifications sont bien activées ✅',tag:'mikadodo-test'});}else new Notification('Mikadodo',{body:'Les notifications sont bien activées ✅'});toast('Notifications déjà activées');}catch(e){toast('Impossible d’afficher le test');}
   return;
 }
 if(Notification.permission==='denied') return showNotificationHelp('Les notifications ont été bloquées par le navigateur. Il faut les autoriser dans les réglages du site, puis revenir ici.');
 try{
   let p=await Notification.requestPermission();
   if(p==='granted'){
     toast('Notifications activées ✅');
     try{if('serviceWorker' in navigator){let reg=await navigator.serviceWorker.ready;await reg.showNotification('Mikadodo',{body:'Notifications activées ✅',tag:'mikadodo-test'});}else new Notification('Mikadodo',{body:'Notifications activées ✅'});}catch(e){}
   }else if(p==='denied') showNotificationHelp('Le navigateur a refusé les notifications. Autorise-les dans les réglages du site, puis réessaie.');
   else toast('Autorisation non accordée');
 }catch(e){showNotificationHelp('Le navigateur ne permet pas actuellement les notifications. Vérifie les autorisations du site.');}
}

 document.getElementById('modal').innerHTML=`<h2>🔔 Notifications</h2><p>${esc(message)}</p><div class="notif"><b>Sur Android / Chrome :</b><br>ouvre les informations du site → <b>Autorisations</b> → <b>Notifications</b> → <b>Autoriser</b>.</div><div class="notif"><b>Sur iPhone / iPad :</b><br>si Mikadodo est installé sur l’écran d’accueil, vérifie les réglages de notifications de l’app. Les notifications Web nécessitent une version compatible d’iOS/iPadOS.</div><p class="small">Une fois l’autorisation donnée, reviens dans Mikadodo et appuie à nouveau sur « Activer les notifications ».</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Fermer</button></div>`;showModal();
}
async function exportData(){try{let backup={version:2,exportedAt:new Date().toISOString(),state:JSON.parse(JSON.stringify(state)),photos:{}};let refs=[];for(const r of backup.state.recipes||[]){for(const ref of (r.photos||[]))if(String(ref).startsWith('idb:'))refs.push(ref);if(String(r.photo||'').startsWith('idb:'))refs.push(r.photo)}for(const x of backup.state.stock||[])if(String(x.photo||'').startsWith('idb:'))refs.push(x.photo);for(const x of backup.state.agenda||[])if(String(x.photo||'').startsWith('idb:'))refs.push(x.photo);refs=[...new Set(refs)];for(const ref of refs){const data=await getPhoto(ref);if(data)backup.photos[ref]=data}let blob=new Blob([JSON.stringify(backup)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mikadodo-sauvegarde-complete.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Sauvegarde complète créée ✅')}catch(e){console.error(e);toast('Impossible de créer la sauvegarde')}}
async function importData(input){let file=input?.files?.[0];if(!file)return;try{let text=await file.text(),raw=JSON.parse(text),incoming=raw?.state&&typeof raw.state==='object'?raw.state:raw;if(!incoming||!Array.isArray(incoming.recipes)||!Array.isArray(incoming.stock)||!Array.isArray(incoming.shopping))throw new Error('Format de sauvegarde invalide');if(!confirm('Importer cette sauvegarde ? Les données actuellement présentes sur cette tablette seront remplacées.')){input.value='';return}state=incoming;state.recipeCategories=Array.isArray(state.recipeCategories)?state.recipeCategories:['Plat','Soupe','Salade','Accompagnement','Sandwich','Petit-déjeuner','Dessert','Jus'];state.shoppingCategories=Array.isArray(state.shoppingCategories)?state.shoppingCategories:['Fruits et légumes','Viandes','Poissons','Produits laitiers','Épicerie','Surgelés','Boissons','Hygiène','Maison','Autre'];state.notes=Array.isArray(state.notes)?state.notes:[];state.mealHistory=Array.isArray(state.mealHistory)?state.mealHistory:[];for(const r of state.recipes){r.used=r.used||{};r.usedStock=r.usedStock||{};r.photos=Array.isArray(r.photos)?r.photos:(r.photo?[r.photo]:[]);r.photo=r.photos[0]||'';r.servUnit=r.servUnit||'personnes'}for(const x of state.stock||[])x.photo=x.photo||'';for(const x of state.agenda||[]){x.advisedTime=x.advisedTime||x.notifyTime||startTime(x.time,x.duration||0);x.notifyTime=x.advisedTime}let photos=raw?.photos||{};for(const [ref,data] of Object.entries(photos)){if(String(ref).startsWith('idb:')&&typeof data==='string')await putPhoto(data,String(ref).slice(4))}photoCache={};save();for(const r of state.recipes)for(const ref of (r.photos||[]))if(String(ref).startsWith('idb:'))await getPhoto(ref);for(const x of state.stock||[])if(String(x.photo).startsWith('idb:'))await getPhoto(x.photo);for(const x of state.agenda||[])if(String(x.photo).startsWith('idb:'))await getPhoto(x.photo);closeModal();renderAll();toast('Données importées avec leurs photos ✅')}catch(e){console.error(e);toast('Import impossible : fichier invalide')}finally{if(input)input.value=''}}
function removeMealHistory(id){state.mealHistory=state.mealHistory||[];state.mealHistory=state.mealHistory.filter(x=>x.id!==id);save();renderMealHistorySettings();toast('Repas supprimé de l’historique')}
function renderMealHistorySettings(){let el=document.getElementById('mealHistorySettings');if(!el)return;let consumed=(state.mealHistory||[]).map(x=>({...x,consumed:true}));let history=[...consumed].sort((a,b)=>(b.date+' '+normalizeTime(b.time)).localeCompare(a.date+' '+normalizeTime(a.time)));el.innerHTML=history.length?history.map(x=>`<div class="shop-item" style="padding:8px 0;border-bottom:1px solid var(--line);gap:8px"><div class="shop-name"><span>${esc(x.name)}</span><div class="small">${esc(new Date(x.date+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'}))} · ${esc(normalizeTime(x.time).replace(':','h'))}${x.consumed?' · ✅ Consommé':''}</div></div>${x.consumed?`<button class="btn ghost mini" style="padding:4px 7px" onclick="removeMealHistory(${x.id})">🗑️</button>`:''}</div>`).join(''):'<div class="empty">Aucun repas dans l’historique pour le moment. 🍽️</div>'}
function renderNotes(){let el=document.getElementById('notesList');if(!el)return;el.innerHTML=state.notes.length?state.notes.map(n=>`<div class="note-item ${n.done?'done':''}"><input type="checkbox" ${n.done?'checked':''} onchange="toggleNote(${n.id})"><span>${esc(n.text)}</span><button class="btn ghost mini" onclick="removeNote(${n.id})">×</button></div>`).join(''):'<div class="empty">Aucune note pour le moment. 🌷</div>'}
function addNote(){let el=document.getElementById('noteInput'),text=el?.value.trim();if(!text)return;state.notes.push({id:Date.now(),text,done:false});save();el.value='';renderNotes();toast('Note ajoutée ✨')}
function toggleNote(id){let n=state.notes.find(x=>x.id===id);if(!n)return;n.done=!n.done;save();renderNotes()}
function removeNote(id){state.notes=state.notes.filter(x=>x.id!==id);save();renderNotes()}
function cycleRecipePhoto(id){let r=state.recipes.find(x=>x.id===id);if(!r)return;let photos=Array.isArray(r.photos)?r.photos:(r.photo?[r.photo]:[]);photos=photos.filter(Boolean);if(photos.length<2)return;let img=document.getElementById('recipeMainPhoto');if(!img)return;let current=parseInt(img.dataset.index||'0',10);if(Number.isNaN(current)||current<0||current>=photos.length)current=0;current=(current+1)%photos.length;img.dataset.index=String(current);img.setAttribute('src',photoSrc(photos[current])||'');let counter=img.parentElement?.querySelector('.photo-counter');if(counter)counter.textContent=`📷 ${current+1} / ${photos.length} — touche la photo pour défiler`}
function zoomPhoto(src){let z=document.getElementById('photoZoom'),im=document.getElementById('photoZoomImg');if(!z||!im)return;im.src=src;z.classList.add('show')}
function closePhotoZoom(){document.getElementById('photoZoom')?.classList.remove('show')}
let cookingTimer={end:0,name:'Plat',minutes:0,interval:null,alarm:false,audio:null,audioTimer:null};
async function scheduleTimerInBackground(){try{if(!('serviceWorker' in navigator))return false;const reg=await navigator.serviceWorker.ready;if(!('showTrigger' in Notification.prototype)&&typeof TimestampTrigger==='undefined')return false;const trigger=typeof TimestampTrigger!=='undefined'?new TimestampTrigger(cookingTimer.end):new window.TimestampTrigger(cookingTimer.end);await reg.showNotification('⏰ Minuteur terminé',{body:`${cookingTimer.name||'La cuisson'} est terminée.`,tag:'mikadodo-cooking-timer',renotify:true,icon:'icon-512.png',badge:'icon-512.png',requireInteraction:true,actions:[{action:'restart',title:'🔄 Relancer'},{action:'stop',title:'⏹️ Éteindre'}],showTrigger:trigger,data:{type:'cooking-timer',minutes:cookingTimer.minutes,name:cookingTimer.name}});return true}catch(e){return false}}
function saveBackgroundTimer(){try{localStorage.setItem('mikadodo-cooking-timer',JSON.stringify({end:cookingTimer.end,name:cookingTimer.name,minutes:cookingTimer.minutes}))}catch(e){}}
function clearBackgroundTimer(){try{localStorage.removeItem('mikadodo-cooking-timer')}catch(e){}}
function restoreBackgroundTimer(){try{const raw=localStorage.getItem('mikadodo-cooking-timer');if(!raw)return;const x=JSON.parse(raw);if(!x||!x.end)return;if(Date.now()>=x.end){localStorage.removeItem('mikadodo-cooking-timer');return;}cookingTimer={end:x.end,name:x.name||'',minutes:Number(x.minutes)||0,interval:null,alarm:false,audio:null,audioTimer:null};renderCookingTimer();document.getElementById('timerBar')?.classList.add('show');cookingTimer.interval=setInterval(()=>{renderCookingTimer();if(Date.now()>=cookingTimer.end){clearInterval(cookingTimer.interval);cookingTimer.interval=null;document.getElementById('timerTime').textContent='00:00';showTimerAlarm();clearBackgroundTimer()}},1000)}catch(e){}}
function startCookingTimer(minutes,name){minutes=Number(minutes)||0;if(minutes<=0)return toast('Cette recette n’a pas de temps de cuisson');stopTimerAlarm(true);if(cookingTimer.interval)clearInterval(cookingTimer.interval);cookingTimer={end:Date.now()+minutes*60000,name:decodeURIComponent(name||''),minutes:minutes,interval:null,alarm:false,audio:null,audioTimer:null};saveBackgroundTimer();scheduleTimerInBackground();renderCookingTimer();cookingTimer.interval=setInterval(()=>{renderCookingTimer();if(Date.now()>=cookingTimer.end){clearInterval(cookingTimer.interval);cookingTimer.interval=null;document.getElementById('timerTime').textContent='00:00';showTimerAlarm();clearBackgroundTimer()}},1000);document.getElementById('timerBar').classList.add('show');toast(`Minuteur lancé : ${minutes} min`)}
function renderCookingTimer(){let sec=Math.max(0,Math.ceil((cookingTimer.end-Date.now())/1000));let m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');let el=document.getElementById('timerTime');if(el)el.textContent=`${m}:${s}`}
function showTimerAlarm(){cookingTimer.alarm=true;document.getElementById('timerBar')?.classList.add('show');document.getElementById('timerAlarmText').textContent=`${cookingTimer.name||'La cuisson'} est terminée.`;document.getElementById('timerAlarm').classList.add('show');startTimerSound()}
function startTimerSound(){stopTimerSound();try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let ctx=new C();cookingTimer.audio=ctx;let notes=[880,1046.5,1318.5,1046.5],step=0;let melody=()=>{if(!cookingTimer.alarm)return;let t=ctx.currentTime;let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=notes[step%notes.length];o.type='triangle';g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.42,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+.42);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.43);step++};melody();cookingTimer.audioTimer=setInterval(melody,500)}catch(e){}}
function stopTimerSound(){if(cookingTimer.audioTimer){clearInterval(cookingTimer.audioTimer);cookingTimer.audioTimer=null}if(cookingTimer.audio){try{cookingTimer.audio.close()}catch(e){}cookingTimer.audio=null}}
function stopTimerAlarm(silent=false){cookingTimer.alarm=false;stopTimerSound();document.getElementById('timerAlarm')?.classList.remove('show');if(!silent)toast('Minuteur arrêté')}
function restartCookingTimer(){let m=cookingTimer.minutes,n=cookingTimer.name;stopTimerAlarm(true);startCookingTimer(m,encodeURIComponent(n));}
function stopCookingTimer(){if(cookingTimer.interval)clearInterval(cookingTimer.interval);clearBackgroundTimer();stopTimerAlarm(true);cookingTimer={end:0,name:'Plat',minutes:0,interval:null,alarm:false,audio:null,audioTimer:null};document.getElementById('timerBar')?.classList.remove('show');toast('Minuteur arrêté')}
function showModal(){document.getElementById('modalBack').classList.add('show');if(!history.state?.modal){history.pushState({mikadodo:true,view:currentView,modal:true},'',`#${currentView}-modal`)}}
function closeModal(fromHistory=false){if(activeRecipeId!==null){let r=state.recipes.find(x=>x.id===Number(activeRecipeId));if(r){delete r._temporaryScaledServings;delete r._temporaryScaledIngredients;if(r.ingredientAvailable){r.ingredientAvailable={};save()}}activeRecipeId=null}document.getElementById('modalBack').classList.remove('show');document.getElementById('modal').className='modal';if(!fromHistory&&history.state?.modal)history.back()}
let notificationTimer=null;
function notificationKey(x){return `mikadodo-notif:${x.id}:${x.date}:${x.notifyTime||startTime(x.time,x.duration)}`}
function wasNotificationSent(x){try{return localStorage.getItem(notificationKey(x))==='1'}catch(e){return false}}
function markNotificationSent(x){try{localStorage.setItem(notificationKey(x),'1')}catch(e){}}
async function showAgendaNotification(x){
  if(!('Notification' in window)||Notification.permission!=='granted')return false;
  const notifyTime=x.notifyTime||startTime(x.time,x.duration);
  const body=x.type==='stock-expiry'?`‼️ ${x.name.replace(/^‼️\s*/,'')} — à consommer aujourd’hui à 12h.`:`${x.name} — rappel à ${notifyTime}. Repas à ${x.time}.`;
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.ready;
      await reg.showNotification('Mikadodo',{body,tag:`agenda-${x.id}`,renotify:true,icon:'icon-512.png',badge:'icon-512.png',data:{agendaId:x.id}});
      return true;
    }
  }catch(e){}
  return false;
}
async function checkNotifications(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=Date.now();
  for(const x of state.agenda){
    const notifyTime=x.notifyTime||startTime(x.time,x.duration);
    const t=new Date(`${x.date}T${notifyTime}:00`).getTime();
    // Autorise un petit retard (jusqu'à 2 minutes) si Chrome a suspendu la page.
    if(!Number.isNaN(t)&&t<=now&&now-t<=120000&&!wasNotificationSent(x)){
      if(await showAgendaNotification(x))markNotificationSent(x);
    }
  }
}
function scheduleNotificationCheck(){
  if(notificationTimer)clearTimeout(notificationTimer);
  let next=Infinity,now=Date.now();
  state.agenda.forEach(x=>{
    const t=new Date(`${x.date}T${x.notifyTime||startTime(x.time,x.duration)}:00`).getTime();
    if(t>now&&!wasNotificationSent(x)&&t<next)next=t;
  });
  if(next<Infinity)notificationTimer=setTimeout(()=>{checkNotifications().finally(scheduleNotificationCheck)},Math.max(1000,next-now));
}
setInterval(()=>{if(syncStockExpiryAgenda()){renderAgenda();updateReminder()}renderStock();checkNotifications();scheduleNotificationCheck()},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkNotifications();scheduleNotificationCheck()}});
window.addEventListener('focus',()=>{checkNotifications();scheduleNotificationCheck()});
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>reg.update()).catch(()=>{});
}
navigator.serviceWorker?.addEventListener('message',e=>{if(e.data?.type==='restart-cooking-timer'){try{const x=JSON.parse(localStorage.getItem('mikadodo-cooking-timer')||'null');if(x&&x.minutes)startCookingTimer(x.minutes,encodeURIComponent(x.name||''));}catch(err){}}});
initPhotoStorage().then(()=>{renderAll();restoreBackgroundTimer()});
checkNotifications();
scheduleNotificationCheck();
</script>
